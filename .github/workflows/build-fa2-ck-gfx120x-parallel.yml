name: Build FlashAttention CK parallel (Windows gfx120x)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "每个 OPT_DIM shard 的 Ninja 并行 worker 数（OOM 时可改为 2）"
        required: false
        default: "4"
      use_cache:
        description: "存在匹配条目时恢复 ninja cache 到 build/（false 时仅 lookup）"
        type: boolean
        required: false
        default: true
      publish_release:
        description: "构建成功后上传到 GitHub Releases"
        type: boolean
        required: false
        default: true
      ck_disable_bwd:
        description: "设为 true 时省略 CK FMHA bwd codegen 并启用 FLASHATTENTION_DISABLE_BACKWARD（ComfyUI 推理专用）；默认 false 完整编译含 bwd"
        type: boolean
        required: false
        default: false
      retry_count:
        description: "看门狗 retry 计数（≥8 不再自动触发）"
        type: string
        required: false
        default: "0"

concurrency:
  group: build-fa2-ck-gfx120x-parallel
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  FA_SRC: C:\fa\flash-attention
  FA_STAGING: C:\fa-staging
  USE_CACHE: ${{ github.event.inputs.use_cache != 'false' && 'true' || 'false' }}
  PUBLISH_RELEASE: ${{ github.event.inputs.publish_release != 'false' && 'true' || 'false' }}
  RETRY_COUNT: ${{ github.event.inputs.retry_count || '0' }}
  CK_FMHA_DISABLE_BWD: ${{ github.event.inputs.ck_disable_bwd == 'true' && '1' || '0' }}

jobs:
  plan-opt-dim:
    name: plan-opt-dim
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      opt-dims-json: ${{ steps.plan-opt-dim-matrix.outputs.opt-dims-json }}
      primary-dim: ${{ steps.plan-opt-dim-matrix.outputs.primary-dim }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap build job
        uses: "./.github/actions/A00.fa-job-bootstrap"
        with:
          prep-source: false
          setup-toolchain: false

      - name: Plan OPT_DIM matrix
        id: plan-opt-dim-matrix
        shell: pwsh
        run: npx tsx scripts/cli.ts 02.plan-opt-dim-matrix

  compile:
    name: compile-d${{ matrix.opt-dim }}
    needs: plan-opt-dim
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        opt-dim: ${{ fromJson(needs.plan-opt-dim.outputs.opt-dims-json) }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap build job
        uses: "./.github/actions/A00.fa-job-bootstrap"

      - name: Fingerprint toolchain for cache key
        id: toolchain-fingerprint
        shell: pwsh
        run: npx tsx scripts/cli.ts 05.toolchain-fingerprint -w $env:GITHUB_WORKSPACE --build-variant parallel --opt-dim "${{ matrix.opt-dim }}"

      - name: Restore ninja incremental build cache
        id: ninja-cache-restore
        uses: "./.github/actions/A02.fa-ninja-cache-restore"
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-key: ${{ steps.toolchain-fingerprint.outputs.cache-key }}
          use-cache: ${{ env.USE_CACHE }}

      - name: Compile OPT_DIM shard with ninja cache
        uses: "./.github/actions/A03.fa-build-with-cache"
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-primary-key: ${{ steps.ninja-cache-restore.outputs.cache-primary-key }}
          cache-exists: ${{ steps.ninja-cache-restore.outputs.cache-exists }}
          use-cache: ${{ env.USE_CACHE }}
          run: npx tsx scripts/cli.ts 06.compile --opt-dim "${{ matrix.opt-dim }}" --fa-src $env:FA_SRC

      - name: Write watchdog abort metadata
        if: always() && !cancelled() && env.ABORT_TRIGGERED == 'true' && env.COMPILE_COMPLETE != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path abort-meta | Out-Null
          $entry = [ordered]@{
            opt_dim = '${{ matrix.opt-dim }}'
            abort_triggered = $true
            force_killed = ($env:ABORT_FORCE_KILLED -eq 'true')
          }
          $entry | ConvertTo-Json -Depth 3 | Out-File -FilePath abort-meta/d${{ matrix.opt-dim }}.json -Encoding utf8

      - name: Upload watchdog abort metadata
        if: always() && !cancelled() && env.ABORT_TRIGGERED == 'true' && env.COMPILE_COMPLETE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: abort-meta-d${{ matrix.opt-dim }}
          path: abort-meta/d${{ matrix.opt-dim }}.json
          retention-days: 1
          if-no-files-found: error

      - name: Validate compile shard outputs
        if: success()
        shell: pwsh
        run: npx tsx scripts/cli.ts 07.shard --fa-src $env:FA_SRC --opt-dim "${{ matrix.opt-dim }}"

      - name: Write compile cache metadata
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cache-meta | Out-Null
          $entry = [ordered]@{
            opt_dim = '${{ matrix.opt-dim }}'
            key = '${{ steps.toolchain-fingerprint.outputs.cache-key }}'
            exists = '${{ steps.ninja-cache-restore.outputs.cache-exists }}' -eq 'true'
            used = '${{ steps.ninja-cache-restore.outputs.cache-used }}' -eq 'true'
          }
          $entry | ConvertTo-Json -Depth 3 | Out-File -FilePath cache-meta/d${{ matrix.opt-dim }}.json -Encoding utf8

      - name: Upload compile cache metadata
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cache-meta-d${{ matrix.opt-dim }}
          path: cache-meta/d${{ matrix.opt-dim }}.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload object files
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: d${{ matrix.opt-dim }}
          path: ${{ env.SHARD_RELEASE_DIR }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

  watchdog-retry:
    name: watchdog-retry
    needs: [plan-opt-dim, compile]
    if: always() && !cancelled() && needs.compile.result == 'failure'
    runs-on: windows-2022

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap build job
        uses: "./.github/actions/A00.fa-job-bootstrap"
        with:
          prep-source: false
          setup-toolchain: false

      - name: Download compile cache metadata
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: cache-meta-d*
          path: cache-meta
          merge-multiple: true

      - name: Download watchdog abort metadata
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: abort-meta-d*
          path: abort-meta
          merge-multiple: true

      - name: Retry after watchdog abort
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/cli.ts 12.watchdog-retry --build-variant parallel --abort-meta-dir abort-meta --cache-meta-dir cache-meta --all-opt-dims '${{ needs.plan-opt-dim.outputs.opt-dims-json }}'

  link:
    name: link-wheel
    needs: [plan-opt-dim, compile]
    if: needs.compile.result == 'success'
    runs-on: windows-2022

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap build job
        uses: "./.github/actions/A00.fa-job-bootstrap"

      - name: Download OPT_DIM object artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: d*
          path: ${{ env.FA_STAGING }}
          merge-multiple: false

      - name: Download compile cache metadata
        uses: actions/download-artifact@v8
        with:
          pattern: cache-meta-d*
          path: cache-meta
          merge-multiple: true

      - name: Link and package wheel from merged objects
        shell: pwsh
        run: npx tsx scripts/cli.ts 08.wheel --fa-src $env:FA_SRC --dist-dir $env:GITHUB_WORKSPACE\dist --staging-root $env:FA_STAGING --primary-dim "${{ needs.plan-opt-dim.outputs.primary-dim }}"

      - name: Verify wheel and publish
        uses: "./.github/actions/A99.fa-verify-publish"
        with:
          build-variant: parallel
          build-caches: cache-meta
