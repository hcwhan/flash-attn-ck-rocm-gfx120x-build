name: Build FlashAttention CK parallel (Windows gfx1201)

on:
  workflow_dispatch:
    inputs:
      flash_attn_ref:
        description: "flash-attention git ref (tag/branch/commit)"
        required: false
        default: "main"
      max_jobs:
        description: "Parallel compile jobs per OPT_DIM shard (use 2 if OOM)"
        required: false
        default: "4"
      use_locked_commit:
        description: "Pin FA source to VERSION.lock.json flash_attention_min_commit"
        required: false
        default: false
        type: boolean

concurrency:
  group: build-fa2-ck-gfx1201-parallel
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTORCH_VERSION: "2.12.0+rocm7.14.0"
  TORCH_DEVICE: "gfx1201"
  ROCM_INDEX: "https://repo.amd.com/rocm/whl-multi-arch/"
  GPU_ARCHS: "gfx1201"
  FLASH_ATTN_REF: ${{ github.event.inputs.flash_attn_ref || 'main' }}
  MAX_JOBS: ${{ github.event.inputs.max_jobs || '4' }}
  FA_SRC: C:\fa\flash-attention
  FA_ARTIFACT: fa-src-patched-gfx1201
  FA_STAGING: C:\fa-staging

jobs:
  prep:
    name: prep-fa-src
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Prepare patched flash-attention source
        uses: ./.github/actions/fa-prep-artifact
        with:
          flash-attn-ref: ${{ env.FLASH_ATTN_REF }}
          fa-src: ${{ env.FA_SRC }}
          artifact-name: ${{ env.FA_ARTIFACT }}
          use-locked-commit: ${{ github.event.inputs.use_locked_commit && 'true' || 'false' }}

  compile:
    name: compile-d${{ matrix.opt_dim }}
    needs: prep
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        opt_dim: ["32", "64", "128", "256"]

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Setup ROCm toolchain
        uses: ./.github/actions/fa-rocm-toolchain
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pytorch-version: ${{ env.PYTORCH_VERSION }}
          torch-device: ${{ env.TORCH_DEVICE }}
          rocm-index: ${{ env.ROCM_INDEX }}

      - name: Download patched flash-attention source
        uses: ./.github/actions/fa-download-src
        with:
          artifact-name: ${{ env.FA_ARTIFACT }}
          fa-src: ${{ env.FA_SRC }}

      - name: Restore ninja incremental build cache
        uses: actions/cache@v6
        id: fa-build-cache
        with:
          path: ${{ env.FA_SRC }}\build
          key: fa2-ck-gfx1201-parallel-d${{ matrix.opt_dim }}-v2-py${{ env.PYTHON_VERSION }}-${{ env.PYTORCH_VERSION }}-${{ env.GPU_ARCHS }}-inference-fwd-${{ hashFiles('build/patch-fa-inference.ps1', 'build/setup-rocm-env.ps1', 'build/compile-opt-dim.ps1', 'build/prep-flash-attention.ps1', 'build/init-fa-build-env.ps1', 'build/link_parallel_wheel.py', 'build/build-bdist-wheel.ps1') }}-${{ env.FLASH_ATTN_REF }}
          restore-keys: |
            fa2-ck-gfx1201-parallel-d${{ matrix.opt_dim }}-v2-py${{ env.PYTHON_VERSION }}-${{ env.PYTORCH_VERSION }}-${{ env.GPU_ARCHS }}-inference-fwd-${{ hashFiles('build/patch-fa-inference.ps1', 'build/setup-rocm-env.ps1', 'build/compile-opt-dim.ps1', 'build/prep-flash-attention.ps1', 'build/init-fa-build-env.ps1', 'build/link_parallel_wheel.py', 'build/build-bdist-wheel.ps1') }}-
          save-always: true

      - name: Report cache status
        shell: pwsh
        run: |
          if ('${{ steps.fa-build-cache.outputs.cache-hit }}' -eq 'true') {
            Write-Host "Cache hit: resuming incremental ninja build for OPT_DIM=${{ matrix.opt_dim }}"
          } else {
            Write-Host "Cache miss: starting fresh compile for OPT_DIM=${{ matrix.opt_dim }} (re-run failed jobs to resume if timed out)"
          }
          if (Test-Path "$env:FA_SRC\build") {
            Get-ChildItem "$env:FA_SRC\build" -Recurse -Filter "*.obj" -ErrorAction SilentlyContinue |
              Measure-Object | ForEach-Object { Write-Host "Cached object files: $($_.Count)" }
          }

      - name: Compile OPT_DIM shard
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\build\compile-opt-dim.ps1 `
            -OptDim "${{ matrix.opt_dim }}" `
            -WorkspaceRoot $env:GITHUB_WORKSPACE `
            -FaSrc $env:FA_SRC
          $release = Get-ChildItem -Path (Join-Path $env:FA_SRC "build") -Directory -Filter "temp.win-*" |
            Select-Object -First 1
          if (-not $release) { throw "temp.win-* missing after compile" }
          "RELEASE_DIR=$(Join-Path $release.FullName 'Release')" >> $env:GITHUB_ENV

      - name: Upload object files
        uses: actions/upload-artifact@v7
        with:
          name: fa-objs-d${{ matrix.opt_dim }}
          path: ${{ env.RELEASE_DIR }}
          retention-days: 3
          if-no-files-found: error

  link:
    name: link-wheel
    needs: compile
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Setup ROCm toolchain
        uses: ./.github/actions/fa-rocm-toolchain
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pytorch-version: ${{ env.PYTORCH_VERSION }}
          torch-device: ${{ env.TORCH_DEVICE }}
          rocm-index: ${{ env.ROCM_INDEX }}

      - name: Download patched flash-attention source
        uses: ./.github/actions/fa-download-src
        with:
          artifact-name: ${{ env.FA_ARTIFACT }}
          fa-src: ${{ env.FA_SRC }}

      - name: Download OPT_DIM object artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: fa-objs-d*
          path: ${{ env.FA_STAGING }}
          merge-multiple: false

      - name: Normalize staging layout
        shell: pwsh
        run: |
          # download-artifact creates fa-objs-d32/ etc.; link script expects d32/
          Get-ChildItem $env:FA_STAGING -Directory | ForEach-Object {
            if ($_.Name -match '^fa-objs-d(\d+)$') {
              $dest = Join-Path $env:FA_STAGING ("d{0}" -f $Matches[1])
              if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
              Move-Item $_.FullName $dest
            }
          }
          Get-ChildItem $env:FA_STAGING -Directory | ForEach-Object { Write-Host "Staging:" $_.Name }

      - name: Validate link staging
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\build\validate-link-staging.ps1 `
            -StagingRoot $env:FA_STAGING `
            -PrimaryDim 32

      - name: Link wheel from merged objects
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE\dist | Out-Null
          . $env:GITHUB_WORKSPACE\build\build-bdist-wheel.ps1 `
            -FaSrc $env:FA_SRC `
            -DistDir $env:GITHUB_WORKSPACE\dist `
            -WorkspaceRoot $env:GITHUB_WORKSPACE `
            -StagingRoot $env:FA_STAGING `
            -PrimaryDim 32
          Get-ChildItem $env:GITHUB_WORKSPACE\dist

      - name: CPU smoke test
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\build\smoke-test-wheel.ps1 -DistDir $env:GITHUB_WORKSPACE\dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: flash-attn-ck-gfx1201-cp312-rocm714
          path: dist/*.whl
          retention-days: 30

      - name: Collect build logs on failure
        if: failure()
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE "build-logs"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          if (Test-Path "$env:GITHUB_WORKSPACE\dist") {
            Copy-Item -Recurse "$env:GITHUB_WORKSPACE\dist" (Join-Path $dest "dist")
          }
          if (Test-Path $env:FA_SRC\build) {
            Copy-Item -Recurse $env:FA_SRC\build (Join-Path $dest "fa-build")
          }
          if (Test-Path $env:FA_STAGING) {
            Copy-Item -Recurse $env:FA_STAGING (Join-Path $dest "fa-staging")
          }

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-parallel
          path: build-logs
          retention-days: 7
          if-no-files-found: ignore
