name: Build FlashAttention CK parallel (Windows gfx1201)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "Ninja parallel compile workers per OPT_DIM shard (use 2 if OOM)"
        required: false
        default: "4"
      skip_cache_restore:
        description: "Skip restoring ninja cache (build still saves cache after compile)"
        type: boolean
        required: false
        default: false
      publish_release:
        description: "Upload wheel to GitHub Releases after successful build"
        type: boolean
        required: false
        default: true

concurrency:
  group: build-fa2-ck-gfx1201-parallel
  cancel-in-progress: true

# actions: write needed for the cache delete-and-refresh flow (REST API);
# contents: write needed for GitHub Releases upload.
permissions:
  actions: write
  contents: write

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  FA_SRC: C:\fa\flash-attention
  FA_ARTIFACT: fa-src-patched-gfx1201
  FA_STAGING: C:\fa-staging
  SKIP_CACHE_RESTORE: ${{ github.event.inputs.skip_cache_restore != 'false' && 'true' || 'false' }}

jobs:
  prep:
    name: prep-fa-src
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      opt-dims-json: ${{ steps.opt-dim-plan.outputs.opt-dims-json }}
      primary-opt-dim: ${{ steps.opt-dim-plan.outputs.primary-opt-dim }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Plan OPT_DIM matrix
        id: opt-dim-plan
        uses: "./.github/actions/00.fa-plan-opt-dim-matrix"

      - name: Prepare patched flash-attention source
        uses: "./.github/actions/02.fa-prep-src"
        with:
          fa-src: ${{ env.FA_SRC }}
          artifact-name: ${{ env.FA_ARTIFACT }}

  compile:
    name: compile-win-gfx1201-d${{ matrix.opt_dim }}
    needs: prep
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        opt_dim: ${{ fromJson(needs.prep.outputs.opt-dims-json) }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap toolchain and FA source
        uses: "./.github/actions/05.fa-job-bootstrap"
        with:
          fa-src: ${{ env.FA_SRC }}
          artifact-name: ${{ env.FA_ARTIFACT }}

      - name: Fingerprint toolchain for cache key
        id: msvc-fp
        uses: "./.github/actions/06.fa-toolchain-fingerprint"

      - name: Compile OPT_DIM shard with ninja cache
        uses: "./.github/actions/08.fa-build-with-cache"
        with:
          fa-src: ${{ env.FA_SRC }}
          # Repository commit covers all build inputs that live in this repo
          # (scripts, VERSION.lock.json incl. the pinned FA commit); the runtime
          # fingerprints cover external inputs: MSVC/clang toolchain (image
          # updates) and the unpinned pip toolchain installs.
          # cache-key: fa2-ck-gfx1201-parallel-v4-d${{ matrix.opt_dim }}-${{ github.sha }}-msvc${{ steps.msvc-fp.outputs.msvc-hash }}-pip${{ steps.msvc-fp.outputs.pip-hash }}
          cache-key: fa2-ck-gfx1201-parallel-v4-d${{ matrix.opt_dim }}-msvc${{ steps.msvc-fp.outputs.msvc-hash }}-pip${{ steps.msvc-fp.outputs.pip-hash }}
          skip-restore: ${{ env.SKIP_CACHE_RESTORE }}
          run: |
            . "$env:GITHUB_WORKSPACE\build\5.compile - compile-opt-dim.ps1" `
              -OptDim "${{ matrix.opt_dim }}" `
              -WorkspaceRoot $env:GITHUB_WORKSPACE `
              -FaSrc $env:FA_SRC

      - name: Validate shard and emit RELEASE_DIR
        shell: pwsh
        run: |
          $releaseDir = . "$env:GITHUB_WORKSPACE\build\6.shard - validate-shard.ps1" `
            -FaSrc $env:FA_SRC `
            -OptDim "${{ matrix.opt_dim }}"
          "RELEASE_DIR=$releaseDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Uploading object files from $releaseDir"

      - name: Upload object files
        uses: actions/upload-artifact@v7
        with:
          name: d${{ matrix.opt_dim }}
          path: ${{ env.RELEASE_DIR }}
          retention-days: 7
          if-no-files-found: error
          # Link merges each shard's .ninja_log into the link build dir; without
          # it ninja rebuilds all kernels from scratch.
          include-hidden-files: true

  link:
    name: link-wheel
    needs: [prep, compile]
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap toolchain and FA source
        uses: "./.github/actions/05.fa-job-bootstrap"
        with:
          fa-src: ${{ env.FA_SRC }}
          artifact-name: ${{ env.FA_ARTIFACT }}

      - name: Download OPT_DIM object artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: d*
          path: ${{ env.FA_STAGING }}
          merge-multiple: false

        # same as serial link-wheel step, but use merged objects
      - name: Link and package wheel from merged objects
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE\build\7.wheel - build-bdist-wheel.ps1" `
            -FaSrc $env:FA_SRC `
            -DistDir $env:GITHUB_WORKSPACE\dist `
            -WorkspaceRoot $env:GITHUB_WORKSPACE `
            -StagingRoot $env:FA_STAGING `
            -PrimaryDim "${{ needs.prep.outputs.primary-opt-dim }}"
          Get-ChildItem $env:GITHUB_WORKSPACE\dist

      - name: Smoke test and upload wheel
        uses: "./.github/actions/10.fa-smoke-test-upload-wheel"

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.publish_release != 'false' }}
        uses: "./.github/actions/11.fa-upload-release"
        with:
          dist-dir: ${{ github.workspace }}/dist
          workflow-name: ${{ github.workflow }}
