name: Build FlashAttention CK parallel (Windows gfx1201)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "Ninja parallel compile workers per OPT_DIM shard (use 2 if OOM)"
        required: false
        default: "4"
      skip_cache_restore:
        description: "Skip restoring ninja cache (build still saves cache after compile)"
        type: boolean
        required: false
        default: true

concurrency:
  group: build-fa2-ck-gfx1201-parallel
  cancel-in-progress: true

# actions: write needed for the cache delete-and-refresh flow (REST API);
# contents: read keeps actions/checkout working (unspecified scopes default to none).
permissions:
  actions: write
  contents: read

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  FA_SRC: C:\fa\flash-attention
  FA_ARTIFACT: fa-src-patched-gfx1201
  FA_STAGING: C:\fa-staging
  SKIP_CACHE_RESTORE: ${{ github.event.inputs.skip_cache_restore != 'false' && 'true' || 'false' }}

jobs:
  prep:
    name: prep-fa-src
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      fa-commit-sha: ${{ steps.fa-prep.outputs.fa-commit-sha }}
      opt-dims-json: ${{ steps.opt-dim-plan.outputs.opt-dims-json }}
      primary-opt-dim: ${{ steps.opt-dim-plan.outputs.primary-opt-dim }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Plan OPT_DIM matrix
        id: opt-dim-plan
        uses: ./.github/actions/fa-plan-opt-dim-matrix

      - name: Prepare patched flash-attention source
        id: fa-prep
        uses: ./.github/actions/fa-prep-artifact
        with:
          fa-src: ${{ env.FA_SRC }}
          artifact-name: ${{ env.FA_ARTIFACT }}

  compile:
    name: compile-d${{ matrix.opt_dim }}
    needs: prep
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        opt_dim: ${{ fromJson(needs.prep.outputs.opt-dims-json) }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap toolchain and FA source
        uses: ./.github/actions/fa-job-bootstrap
        with:
          fa-src: ${{ env.FA_SRC }}
          artifact-name: ${{ env.FA_ARTIFACT }}

      - name: Fingerprint MSVC toolset for cache key
        id: msvc-fp
        uses: ./.github/actions/fa-msvc-fingerprint

      - name: Compile OPT_DIM shard with ninja cache
        uses: ./.github/actions/fa-build-with-cache
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-key: fa2-ck-gfx1201-parallel-v3-d${{ matrix.opt_dim }}-py${{ env.PYTHON_VERSION }}-${{ env.PYTORCH_VERSION }}-${{ env.GPU_ARCHS }}-inference-fwd-${{ hashFiles('build/patch/patch-fa-inference.ps1', 'build/env/setup-rocm-env.ps1', 'build/prep/prep-flash-attention.ps1', 'build/env/init-fa-build-env.ps1', 'build/config/read-version-lock.ps1', 'build/compile/compile-opt-dim.ps1', 'build/compile/link_parallel_wheel.py', 'build/wheel/build-bdist-wheel.ps1', 'build/common/paths.ps1', 'build/common/get-fa-release-dir.ps1', 'build/common/get-rocm-sdk-paths.ps1', 'VERSION.lock.json') }}-${{ needs.prep.outputs.fa-commit-sha }}-msvc${{ steps.msvc-fp.outputs.msvc-hash }}
          skip-restore: ${{ env.SKIP_CACHE_RESTORE }}
          run: |
            . $env:GITHUB_WORKSPACE\build\compile\compile-opt-dim.ps1 `
              -OptDim "${{ matrix.opt_dim }}" `
              -WorkspaceRoot $env:GITHUB_WORKSPACE `
              -FaSrc $env:FA_SRC
            Write-Host "Uploading object files from $env:RELEASE_DIR"

      - name: Upload object files
        uses: actions/upload-artifact@v7
        with:
          name: d${{ matrix.opt_dim }}
          path: ${{ env.RELEASE_DIR }}
          retention-days: 7
          if-no-files-found: error

  link:
    name: link-wheel
    needs: [prep, compile]
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap toolchain and FA source
        uses: ./.github/actions/fa-job-bootstrap
        with:
          fa-src: ${{ env.FA_SRC }}
          artifact-name: ${{ env.FA_ARTIFACT }}

      - name: Download OPT_DIM object artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: d*
          path: ${{ env.FA_STAGING }}
          merge-multiple: false

      - name: Link wheel from merged objects
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\build\wheel\build-bdist-wheel.ps1 `
            -FaSrc $env:FA_SRC `
            -DistDir $env:GITHUB_WORKSPACE\dist `
            -WorkspaceRoot $env:GITHUB_WORKSPACE `
            -StagingRoot $env:FA_STAGING `
            -PrimaryDim "${{ needs.prep.outputs.primary-opt-dim }}"
          Get-ChildItem $env:GITHUB_WORKSPACE\dist

      - name: Smoke test and upload wheel
        uses: ./.github/actions/fa-smoke-test-upload-wheel
