name: Build FlashAttention CK parallel (Windows gfx1201)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "Ninja parallel compile workers per OPT_DIM shard (use 2 if OOM)"
        required: false
        default: "4"
      skip_cache_restore:
        description: "Skip restoring ninja cache (build still saves cache after compile)"
        type: boolean
        required: false
        default: false
      publish_release:
        description: "Upload wheel to GitHub Releases after successful build"
        type: boolean
        required: false
        default: true

concurrency:
  group: build-fa2-ck-gfx1201-parallel
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  FA_SRC: C:\fa\flash-attention
  FA_STAGING: C:\fa-staging
  SKIP_CACHE_RESTORE: ${{ github.event.inputs.skip_cache_restore != 'false' && 'true' || 'false' }}

jobs:
  plan-opt-dim:
    name: plan-opt-dim
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      opt-dims-json: ${{ steps.plan-opt-dim-matrix.outputs.opt-dims-json }}
      primary-dim: ${{ steps.plan-opt-dim-matrix.outputs.primary-dim }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap build job
        uses: "./.github/actions/A00.fa-job-bootstrap"
        with:
          prep-source: false
          setup-toolchain: false

      - name: Plan OPT_DIM matrix
        id: plan-opt-dim-matrix
        shell: pwsh
        run: npx tsx scripts/cli.ts 02.plan-opt-dim-matrix

  compile:
    name: compile-d${{ matrix.opt-dim }}
    needs: plan-opt-dim
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        opt-dim: ${{ fromJson(needs.plan-opt-dim.outputs.opt-dims-json) }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap build job
        uses: "./.github/actions/A00.fa-job-bootstrap"

      - name: Fingerprint toolchain for cache key
        id: toolchain-fingerprint
        shell: pwsh
        run: npx tsx scripts/cli.ts 05.toolchain-fingerprint -w $env:GITHUB_WORKSPACE --build-variant parallel --opt-dim "${{ matrix.opt-dim }}"

      - name: Compile OPT_DIM shard with ninja cache
        id: compile-shard
        uses: "./.github/actions/A03.fa-build-with-cache"
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-key: ${{ steps.toolchain-fingerprint.outputs.cache-key }}
          skip-cache-restore: ${{ env.SKIP_CACHE_RESTORE }}
          run: npx tsx scripts/cli.ts 06.compile --opt-dim "${{ matrix.opt-dim }}" --fa-src $env:FA_SRC

      - name: Validate shard and emit SHARD_RELEASE_DIR
        shell: pwsh
        run: npx tsx scripts/cli.ts 07.shard --fa-src $env:FA_SRC --opt-dim "${{ matrix.opt-dim }}"

      - name: Write compile cache metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cache-meta | Out-Null
          $entry = [ordered]@{
            opt_dim = '${{ matrix.opt-dim }}'
            key = '${{ steps.toolchain-fingerprint.outputs.cache-key }}'
            hit = '${{ steps.compile-shard.outputs.cache-hit }}' -eq 'true'
          }
          $entry | ConvertTo-Json -Depth 3 | Out-File -FilePath cache-meta/d${{ matrix.opt-dim }}.json -Encoding utf8

      - name: Upload compile cache metadata
        uses: actions/upload-artifact@v7
        with:
          name: cache-meta-d${{ matrix.opt-dim }}
          path: cache-meta/d${{ matrix.opt-dim }}.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload object files
        uses: actions/upload-artifact@v7
        with:
          name: d${{ matrix.opt-dim }}
          path: ${{ env.SHARD_RELEASE_DIR }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

  link:
    name: link-wheel
    needs: [plan-opt-dim, compile]
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap build job
        uses: "./.github/actions/A00.fa-job-bootstrap"

      - name: Download OPT_DIM object artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: d*
          path: ${{ env.FA_STAGING }}
          merge-multiple: false

      - name: Download compile cache metadata
        uses: actions/download-artifact@v8
        with:
          pattern: cache-meta-d*
          path: cache-meta
          merge-multiple: true

      - name: Link and package wheel from merged objects
        shell: pwsh
        run: npx tsx scripts/cli.ts 08.wheel --fa-src $env:FA_SRC --dist-dir $env:GITHUB_WORKSPACE\dist --staging-root $env:FA_STAGING --primary-dim "${{ needs.plan-opt-dim.outputs.primary-dim }}"

      - name: Verify wheel and publish
        uses: "./.github/actions/A99.fa-verify-publish"
        with:
          build-variant: parallel
          build-caches: cache-meta
