name: Build FlashAttention CK parallel (Windows gfx1201)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "Ninja parallel compile workers per OPT_DIM shard (use 2 if OOM)"
        required: false
        default: "4"
      skip_cache_restore:
        description: "Skip restoring ninja cache (build still saves cache after compile)"
        type: boolean
        required: false
        default: true

concurrency:
  group: build-fa2-ck-gfx1201-parallel
  cancel-in-progress: true

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers || '4' }}
  FA_SRC: C:\fa\flash-attention
  FA_ARTIFACT: fa-src-patched-gfx1201
  FA_STAGING: C:\fa-staging

jobs:
  prep:
    name: prep-fa-src
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      fa-commit-sha: ${{ steps.fa-prep.outputs.fa-commit-sha }}
      opt-dims-json: ${{ steps.opt-dim-plan.outputs.opt_dims_json }}
      primary-opt-dim: ${{ steps.opt-dim-plan.outputs.primary_opt_dim }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Plan OPT_DIM matrix from VERSION.lock.json
        id: opt-dim-plan
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\build\config\read-version-lock.ps1 -WorkspaceRoot $env:GITHUB_WORKSPACE
          $json = ($OptDimList | ConvertTo-Json -Compress)
          Write-Host "OPT_DIM matrix from lock: $json"
          Write-Host "Primary OPT_DIM shard: $PrimaryOptDim"
          "opt_dims_json=$json" >> $env:GITHUB_OUTPUT
          "primary_opt_dim=$PrimaryOptDim" >> $env:GITHUB_OUTPUT

      - name: Prepare patched flash-attention source
        id: fa-prep
        uses: ./.github/actions/fa-prep-artifact
        with:
          fa-src: ${{ env.FA_SRC }}
          artifact-name: ${{ env.FA_ARTIFACT }}

  compile:
    name: compile-d${{ matrix.opt_dim }}
    needs: prep
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        opt_dim: ${{ fromJson(needs.prep.outputs.opt-dims-json) }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Load VERSION.lock.json
        uses: ./.github/actions/fa-read-version-lock

      - name: Setup ROCm toolchain
        uses: ./.github/actions/fa-rocm-toolchain
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pytorch-version: ${{ env.PYTORCH_VERSION }}
          torch-device: ${{ env.TORCH_DEVICE }}
          rocm-index: ${{ env.ROCM_INDEX }}
          rocm-version: ${{ env.HIP_VERSION }}

      - name: Download patched flash-attention source
        uses: ./.github/actions/fa-download-src
        with:
          artifact-name: ${{ env.FA_ARTIFACT }}
          fa-src: ${{ env.FA_SRC }}

      - name: Restore ninja incremental build cache
        id: fa-build-cache
        uses: ./.github/actions/fa-ninja-cache-restore
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-key: fa2-ck-gfx1201-parallel-v2-d${{ matrix.opt_dim }}-py${{ env.PYTHON_VERSION }}-${{ env.PYTORCH_VERSION }}-${{ env.GPU_ARCHS }}-inference-fwd-${{ hashFiles('build/patch/patch-fa-inference.ps1', 'build/patch/patch-ck-windows.ps1', 'build/env/setup-rocm-env.ps1', 'build/prep/prep-flash-attention.ps1', 'build/env/init-fa-build-env.ps1', 'build/config/read-version-lock.ps1', 'build/compile/compile-opt-dim.ps1', 'build/common/paths.ps1', 'VERSION.lock.json') }}-${{ needs.prep.outputs.fa-commit-sha }}
          skip-restore: ${{ github.event.inputs.skip_cache_restore != false && 'true' || 'false' }}

      - name: Report cache status
        shell: pwsh
        run: |
          Write-Host "flash-attention commit: ${{ needs.prep.outputs.fa-commit-sha }}"
          Write-Host "skip_cache_restore: ${{ github.event.inputs.skip_cache_restore != false }}"
          if ('${{ github.event.inputs.skip_cache_restore != false }}' -eq 'true') {
            Write-Host "Cache restore skipped by workflow input; compiling fresh (cache save still enabled)"
          } elseif ('${{ steps.fa-build-cache.outputs.cache-hit }}' -eq 'true') {
            Write-Host "Cache hit: resuming incremental ninja build for OPT_DIM=${{ matrix.opt_dim }}"
          } else {
            Write-Host "Cache miss: starting fresh compile for OPT_DIM=${{ matrix.opt_dim }} (re-run failed jobs to resume if timed out)"
          }
          if (Test-Path "$env:FA_SRC\build") {
            Get-ChildItem "$env:FA_SRC\build" -Recurse -Filter "*.obj" -ErrorAction SilentlyContinue |
              Measure-Object | ForEach-Object { Write-Host "Cached object files: $($_.Count)" }
          }

      - name: Compile OPT_DIM shard
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\build\compile\compile-opt-dim.ps1 `
            -OptDim "${{ matrix.opt_dim }}" `
            -WorkspaceRoot $env:GITHUB_WORKSPACE `
            -FaSrc $env:FA_SRC
          $release = Get-ChildItem -Path (Join-Path $env:FA_SRC "build") -Directory -Filter "temp.win-*" |
            Select-Object -First 1
          if (-not $release) { throw "temp.win-* missing after compile" }
          "RELEASE_DIR=$(Join-Path $release.FullName 'Release')" >> $env:GITHUB_ENV

      - name: Save ninja incremental build cache
        if: always()
        uses: ./.github/actions/fa-ninja-cache-save
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-primary-key: ${{ steps.fa-build-cache.outputs.cache-primary-key }}

      - name: Upload object files
        uses: actions/upload-artifact@v7
        with:
          name: fa-objs-d${{ matrix.opt_dim }}
          path: ${{ env.RELEASE_DIR }}
          retention-days: 7
          if-no-files-found: error

      - name: Collect build logs on failure
        if: failure()
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\build\common\collect-build-logs.ps1 `
            -WorkspaceRoot $env:GITHUB_WORKSPACE `
            -FaSrc $env:FA_SRC

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-d${{ matrix.opt_dim }}
          path: build-logs
          retention-days: 7
          if-no-files-found: ignore

  link:
    name: link-wheel
    needs: [prep, compile]
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Load VERSION.lock.json
        uses: ./.github/actions/fa-read-version-lock

      - name: Setup ROCm toolchain
        uses: ./.github/actions/fa-rocm-toolchain
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pytorch-version: ${{ env.PYTORCH_VERSION }}
          torch-device: ${{ env.TORCH_DEVICE }}
          rocm-index: ${{ env.ROCM_INDEX }}
          rocm-version: ${{ env.HIP_VERSION }}

      - name: Download patched flash-attention source
        uses: ./.github/actions/fa-download-src
        with:
          artifact-name: ${{ env.FA_ARTIFACT }}
          fa-src: ${{ env.FA_SRC }}

      - name: Download OPT_DIM object artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: fa-objs-d*
          path: ${{ env.FA_STAGING }}
          merge-multiple: false

      - name: Normalize staging layout
        shell: pwsh
        run: |
          Write-Host "flash-attention commit: ${{ needs.prep.outputs.fa-commit-sha }}"
          # download-artifact creates fa-objs-d32/ etc.; link script expects d32/
          Get-ChildItem $env:FA_STAGING -Directory | ForEach-Object {
            if ($_.Name -match '^fa-objs-d(\d+)$') {
              $dest = Join-Path $env:FA_STAGING ("d{0}" -f $Matches[1])
              if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
              Move-Item $_.FullName $dest
            }
          }
          Get-ChildItem $env:FA_STAGING -Directory | ForEach-Object { Write-Host "Staging:" $_.Name }

      - name: Link wheel from merged objects
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE\dist | Out-Null
          . $env:GITHUB_WORKSPACE\build\wheel\build-bdist-wheel.ps1 `
            -FaSrc $env:FA_SRC `
            -DistDir $env:GITHUB_WORKSPACE\dist `
            -WorkspaceRoot $env:GITHUB_WORKSPACE `
            -StagingRoot $env:FA_STAGING `
            -PrimaryDim "${{ needs.prep.outputs.primary-opt-dim }}"
          Get-ChildItem $env:GITHUB_WORKSPACE\dist

      - name: CPU smoke test
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\build\test\smoke-test-wheel.ps1 `
            -DistDir $env:GITHUB_WORKSPACE\dist `
            -WorkspaceRoot $env:GITHUB_WORKSPACE `
            -FaSrc $env:FA_SRC `
            -FaCommitSha "${{ needs.prep.outputs.fa-commit-sha }}"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WHEEL_ARTIFACT_NAME }}
          path: |
            dist/*.whl
            dist/*.sha256
            dist/wheel.manifest.json
          retention-days: 30

      - name: Collect build logs on failure
        if: failure()
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\build\common\collect-build-logs.ps1 `
            -WorkspaceRoot $env:GITHUB_WORKSPACE `
            -FaSrc $env:FA_SRC `
            -StagingRoot $env:FA_STAGING

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: build-logs
          retention-days: 7
          if-no-files-found: ignore
