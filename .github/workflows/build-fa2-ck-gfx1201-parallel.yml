name: Build FlashAttention CK parallel (Windows gfx1201)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "Ninja parallel compile workers per OPT_DIM shard (use 2 if OOM)"
        required: false
        default: "4"
      skip_cache_restore:
        description: "Skip restoring ninja cache (build still saves cache after compile)"
        type: boolean
        required: false
        default: false
      publish_release:
        description: "Upload wheel to GitHub Releases after successful build"
        type: boolean
        required: false
        default: true

concurrency:
  group: build-fa2-ck-gfx1201-parallel
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  FA_SRC: C:\fa\flash-attention
  FA_STAGING: C:\fa-staging
  SKIP_CACHE_RESTORE: ${{ github.event.inputs.skip_cache_restore != 'false' && 'true' || 'false' }}

jobs:
  plan-opt-dim:
    name: plan-opt-dim
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      opt-dims-json: ${{ steps.plan-opt-dim-matrix.outputs.opt-dims-json }}
      primary-dim: ${{ steps.plan-opt-dim-matrix.outputs.primary-dim }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install npm dependencies
        shell: pwsh
        run: npm ci

      - name: Load VERSION.lock.json
        shell: pwsh
        run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

      - name: Plan OPT_DIM matrix
        id: plan-opt-dim-matrix
        shell: pwsh
        run: npx tsx scripts/cli.ts 02.plan-opt-dim-matrix

  compile:
    name: compile-d${{ matrix.opt-dim }}
    needs: plan-opt-dim
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        opt-dim: ${{ fromJson(needs.plan-opt-dim.outputs.opt-dims-json) }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install npm dependencies
        shell: pwsh
        run: npm ci

      - name: Load VERSION.lock.json
        shell: pwsh
        run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

      - name: Clone and patch flash-attention source
        shell: pwsh
        run: |
          npx tsx scripts/cli.ts 03.prep --fa-src $env:FA_SRC
          npx tsx scripts/cli.ts 04.patch --fa-src $env:FA_SRC

      - name: Setup ROCm toolchain
        uses: "./.github/actions/01.fa-rocm-toolchain"
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pytorch-version: ${{ env.PYTORCH_VERSION }}
          torch-device-extra: ${{ env.TORCH_DEVICE_EXTRA }}
          rocm-index: ${{ env.ROCM_INDEX }}
          rocm-version: ${{ env.ROCM_VERSION }}
          pip-cache-key: ${{ env.PIP_TOOLCHAIN_CACHE_KEY }}

      - name: Fingerprint toolchain for cache key
        id: toolchain-fingerprint
        shell: pwsh
        run: npx tsx scripts/cli.ts 05.toolchain-fingerprint -w $env:GITHUB_WORKSPACE --build-variant parallel --opt-dim "${{ matrix.opt-dim }}"

      - name: Compile OPT_DIM shard with ninja cache
        id: compile-shard
        uses: "./.github/actions/03.fa-build-with-cache"
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-key: ${{ steps.toolchain-fingerprint.outputs.cache-key }}
          skip-cache-restore: ${{ env.SKIP_CACHE_RESTORE }}
          run: npx tsx scripts/cli.ts 06.compile --opt-dim "${{ matrix.opt-dim }}" --fa-src $env:FA_SRC

      - name: Write compile cache metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cache-meta | Out-Null
          $entry = [ordered]@{
            opt_dim = '${{ matrix.opt-dim }}'
            key = '${{ steps.toolchain-fingerprint.outputs.cache-key }}'
            hit = '${{ steps.compile-shard.outputs.cache-hit }}' -eq 'true'
            restore_skipped = $env:SKIP_CACHE_RESTORE -eq 'true'
          }
          $entry | ConvertTo-Json -Depth 3 | Out-File -FilePath cache-meta/d${{ matrix.opt-dim }}.json -Encoding utf8

      - name: Upload compile cache metadata
        uses: actions/upload-artifact@v7
        with:
          name: cache-meta-d${{ matrix.opt-dim }}
          path: cache-meta/d${{ matrix.opt-dim }}.json
          retention-days: 7
          if-no-files-found: error

      - name: Validate shard and emit SHARD_RELEASE_DIR
        shell: pwsh
        run: npx tsx scripts/cli.ts 07.shard --fa-src $env:FA_SRC --opt-dim "${{ matrix.opt-dim }}"

      - name: Upload object files
        uses: actions/upload-artifact@v7
        with:
          name: d${{ matrix.opt-dim }}
          path: ${{ env.SHARD_RELEASE_DIR }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

  link:
    name: link-wheel
    needs: [plan-opt-dim, compile]
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install npm dependencies
        shell: pwsh
        run: npm ci

      - name: Load VERSION.lock.json
        shell: pwsh
        run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

      - name: Clone and patch flash-attention source
        shell: pwsh
        run: |
          npx tsx scripts/cli.ts 03.prep --fa-src $env:FA_SRC
          npx tsx scripts/cli.ts 04.patch --fa-src $env:FA_SRC

      - name: Setup ROCm toolchain
        uses: "./.github/actions/01.fa-rocm-toolchain"
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pytorch-version: ${{ env.PYTORCH_VERSION }}
          torch-device-extra: ${{ env.TORCH_DEVICE_EXTRA }}
          rocm-index: ${{ env.ROCM_INDEX }}
          rocm-version: ${{ env.ROCM_VERSION }}
          pip-cache-key: ${{ env.PIP_TOOLCHAIN_CACHE_KEY }}

      - name: Download OPT_DIM object artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: d*
          path: ${{ env.FA_STAGING }}
          merge-multiple: false

      - name: Download compile cache metadata
        uses: actions/download-artifact@v8
        with:
          pattern: cache-meta-d*
          path: cache-meta
          merge-multiple: true

      - name: Link and package wheel from merged objects
        shell: pwsh
        run: npx tsx scripts/cli.ts 08.wheel --fa-src $env:FA_SRC --dist-dir $env:GITHUB_WORKSPACE\dist --staging-root $env:FA_STAGING --primary-dim "${{ needs.plan-opt-dim.outputs.primary-dim }}"

      - name: Smoke test (CPU)
        shell: pwsh
        run: npx tsx scripts/cli.ts 09.verify --dist-dir $env:GITHUB_WORKSPACE\dist --build-variant parallel --build-caches $env:GITHUB_WORKSPACE\cache-meta

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WHEEL_ARTIFACT_NAME }}
          path: |
            dist/*.whl
            dist/*.sha256
            dist/wheel.manifest.json
          retention-days: 30

      - name: Prepare release metadata
        if: ${{ github.event.inputs.publish_release != 'false' }}
        id: publish
        shell: pwsh
        run: npx tsx scripts/cli.ts 10.publish --dist-dir $env:GITHUB_WORKSPACE\dist --workflow-name "${{ github.workflow }}" --build-variant parallel

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.publish_release != 'false' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.publish.outputs.release-tag }}
          name: ${{ steps.publish.outputs.release-title }}
          body_path: ${{ steps.publish.outputs.body-path }}
          files: |
            dist/*.whl
            dist/*.sha256
            dist/wheel.manifest.json
          prerelease: false
          make_latest: false
