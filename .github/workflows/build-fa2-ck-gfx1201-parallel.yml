name: Build FlashAttention CK parallel (Windows gfx1201)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "Ninja parallel compile workers per OPT_DIM shard (use 2 if OOM)"
        required: false
        default: "4"
      skip_cache_restore:
        description: "Skip restoring ninja cache (build still saves cache after compile)"
        type: boolean
        required: false
        default: false
      publish_release:
        description: "Upload wheel to GitHub Releases after successful build"
        type: boolean
        required: false
        default: true

concurrency:
  group: build-fa2-ck-gfx1201-parallel
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  FA_SRC: C:\fa\flash-attention
  FA_ARTIFACT: fa-src-patched-gfx1201
  FA_STAGING: C:\fa-staging
  SKIP_CACHE_RESTORE: ${{ github.event.inputs.skip_cache_restore != 'false' && 'true' || 'false' }}

jobs:
  prep:
    name: prep-fa-src
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      opt-dims-json: ${{ steps.plan-opt-dim-matrix.outputs.opt_dims_json }}
      primary-opt-dim: ${{ steps.plan-opt-dim-matrix.outputs.primary_opt_dim }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install npm dependencies
        shell: pwsh
        run: npm ci

      - name: Load VERSION.lock.json
        shell: pwsh
        run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

      - name: Plan OPT_DIM matrix
        id: plan-opt-dim-matrix
        shell: pwsh
        run: npx tsx scripts/cli.ts 02.plan-opt-dim-matrix

      - name: Clone flash-attention source
        shell: pwsh
        run: npx tsx scripts/cli.ts 03.prep --flash-attention-root $env:FA_SRC

      - name: Patch flash-attention for inference-only build
        shell: pwsh
        run: npx tsx scripts/cli.ts 04.patch --flash-attention-root $env:FA_SRC

      - name: Upload patched source artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FA_ARTIFACT }}
          path: ${{ env.FA_SRC }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 9

  compile:
    name: compile-d${{ matrix.opt_dim }}
    needs: prep
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        opt_dim: ${{ fromJson(needs.prep.outputs.opt-dims-json) }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install npm dependencies
        shell: pwsh
        run: npm ci

      - name: Load VERSION.lock.json
        shell: pwsh
        run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

      - name: Setup ROCm toolchain
        uses: "./.github/actions/01.fa-rocm-toolchain"
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pytorch-version: ${{ env.PYTORCH_VERSION }}
          torch-device: ${{ env.TORCH_DEVICE }}
          rocm-index: ${{ env.ROCM_INDEX }}
          rocm-version: ${{ env.HIP_VERSION }}

      - name: Download patched flash-attention source
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.FA_ARTIFACT }}
          path: ${{ env.FA_SRC }}

      - name: Fingerprint toolchain for cache key
        id: toolchain-fingerprint
        shell: pwsh
        run: npx tsx scripts/cli.ts 05.toolchain-fingerprint --cache-variant parallel --opt-dim "${{ matrix.opt_dim }}"

      - name: Compile OPT_DIM shard with ninja cache
        uses: "./.github/actions/03.fa-build-with-cache"
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-key: ${{ steps.toolchain-fingerprint.outputs.cache-key }}
          skip-restore: ${{ env.SKIP_CACHE_RESTORE }}
          run: npx tsx scripts/cli.ts 06.compile --opt-dim "${{ matrix.opt_dim }}" --fa-src $env:FA_SRC

      - name: Validate shard and emit RELEASE_DIR
        shell: pwsh
        run: npx tsx scripts/cli.ts 07.shard --fa-src $env:FA_SRC --opt-dim "${{ matrix.opt_dim }}"

      - name: Upload object files
        uses: actions/upload-artifact@v7
        with:
          name: d${{ matrix.opt_dim }}
          path: ${{ env.RELEASE_DIR }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

  link:
    name: link-wheel
    needs: [prep, compile]
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install npm dependencies
        shell: pwsh
        run: npm ci

      - name: Load VERSION.lock.json
        shell: pwsh
        run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

      - name: Setup ROCm toolchain
        uses: "./.github/actions/01.fa-rocm-toolchain"
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pytorch-version: ${{ env.PYTORCH_VERSION }}
          torch-device: ${{ env.TORCH_DEVICE }}
          rocm-index: ${{ env.ROCM_INDEX }}
          rocm-version: ${{ env.HIP_VERSION }}

      - name: Download patched flash-attention source
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.FA_ARTIFACT }}
          path: ${{ env.FA_SRC }}

      - name: Download OPT_DIM object artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: d*
          path: ${{ env.FA_STAGING }}
          merge-multiple: false

      - name: Link and package wheel from merged objects
        shell: pwsh
        run: npx tsx scripts/cli.ts 08.wheel --fa-src $env:FA_SRC --dist-dir $env:GITHUB_WORKSPACE\dist --staging-root $env:FA_STAGING --primary-dim "${{ needs.prep.outputs.primary-opt-dim }}"

      - name: Smoke test (CPU)
        shell: pwsh
        run: npx tsx scripts/cli.ts 09.verify --dist-dir $env:GITHUB_WORKSPACE\dist --release-variant parallel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WHEEL_ARTIFACT_NAME }}
          path: |
            dist/*.whl
            dist/*.sha256
            dist/wheel.manifest.json
          retention-days: 30

      - name: Prepare release metadata
        if: ${{ github.event.inputs.publish_release != 'false' }}
        id: publish
        shell: pwsh
        run: npx tsx scripts/cli.ts 10.publish --dist-dir $env:GITHUB_WORKSPACE\dist --workflow-name "${{ github.workflow }}" --release-variant parallel

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.publish_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.publish.outputs.tag }}
          name: ${{ steps.publish.outputs.release_title }}
          body_path: ${{ steps.publish.outputs.body_path }}
          files: |
            dist/*.whl
            dist/*.sha256
            dist/wheel.manifest.json
          prerelease: true
          make_latest: false
