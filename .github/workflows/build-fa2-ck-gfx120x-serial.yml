name: Build FlashAttention CK serial (Windows gfx120x)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "单次全量 compile（lock CK_OPT_DIM）的 Ninja 并行 worker 数（OOM 时可改为 2）"
        required: false
        default: "4"
      use_cache:
        description: "存在匹配条目时恢复 ninja cache 到 build/（false 时仅 lookup）"
        type: boolean
        required: false
        default: true
      publish_release:
        description: "构建成功后上传到 GitHub Releases"
        type: boolean
        required: false
        default: true

concurrency:
  group: build-fa2-ck-gfx120x-serial
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  FA_SRC: C:\fa\flash-attention
  USE_CACHE: ${{ github.event.inputs.use_cache != 'false' && 'true' || 'false' }}

jobs:
  compile-full-and-link-wheel:
    name: compile-full-and-link-wheel
    runs-on: windows-2022

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap build job
        uses: "./.github/actions/A00.fa-job-bootstrap"

      - name: Fingerprint toolchain for cache key
        id: toolchain-fingerprint
        shell: pwsh
        run: npx tsx scripts/cli.ts 05.toolchain-fingerprint -w $env:GITHUB_WORKSPACE --build-variant serial

      - name: Restore ninja incremental build cache
        id: ninja-cache-restore
        uses: "./.github/actions/A02.fa-ninja-cache-restore"
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-key: ${{ steps.toolchain-fingerprint.outputs.cache-key }}
          use-cache: ${{ env.USE_CACHE }}

      - name: Compile OPT_DIM full with ninja cache
        uses: "./.github/actions/A03.fa-build-with-cache"
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-primary-key: ${{ steps.ninja-cache-restore.outputs.cache-primary-key }}
          cache-exists: ${{ steps.ninja-cache-restore.outputs.cache-exists }}
          use-cache: ${{ env.USE_CACHE }}
          run: npx tsx scripts/cli.ts 06.compile --opt-dim "${{ env.CK_OPT_DIM }}" --fa-src $env:FA_SRC

      - name: Write compile cache metadata
        shell: pwsh
        run: |
          $entry = [ordered]@{
            opt_dim = $env:CK_OPT_DIM
            key = '${{ steps.toolchain-fingerprint.outputs.cache-key }}'
            exists = '${{ steps.ninja-cache-restore.outputs.cache-exists }}' -eq 'true'
            used = '${{ steps.ninja-cache-restore.outputs.cache-used }}' -eq 'true'
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $entry | ConvertTo-Json -Depth 3 -AsArray | Out-File -FilePath dist/build-caches.json -Encoding utf8

      - name: Link and package wheel from in-place objects
        shell: pwsh
        run: npx tsx scripts/cli.ts 08.wheel --fa-src $env:FA_SRC --dist-dir $env:GITHUB_WORKSPACE\dist

      - name: Verify wheel and publish
        uses: "./.github/actions/A99.fa-verify-publish"
        with:
          build-variant: serial
          build-caches: dist/build-caches.json
