name: Build FlashAttention CK serial (Windows gfx120x)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "单次全量 compile（lock CK_OPT_DIM）的 Ninja 并行 worker 数（OOM 时可改为 2）"
        required: false
        default: "4"
      use_cache:
        description: "存在匹配条目时恢复 ninja cache 到 build/（false 时仅 lookup）"
        type: boolean
        required: false
        default: true
      publish_release:
        description: "构建成功后上传到 GitHub Releases"
        type: boolean
        required: false
        default: true
      ck_disable_bwd:
        description: "设为 true 时省略 CK FMHA bwd codegen 并启用 FLASHATTENTION_DISABLE_BACKWARD（ComfyUI 推理专用）；默认 false 完整编译含 bwd"
        type: boolean
        required: false
        default: false
      retry_count:
        description: "看门狗 retry 计数（≥8 不再自动触发）"
        type: string
        required: false
        default: "0"

concurrency:
  group: build-fa2-ck-gfx120x-serial
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  FA_SRC: C:\fa\flash-attention
  USE_CACHE: ${{ github.event.inputs.use_cache != 'false' && 'true' || 'false' }}
  PUBLISH_RELEASE: ${{ github.event.inputs.publish_release != 'false' && 'true' || 'false' }}
  RETRY_COUNT: ${{ github.event.inputs.retry_count || '0' }}
  CK_FMHA_DISABLE_BWD: ${{ github.event.inputs.ck_disable_bwd == 'true' && '1' || '0' }}

jobs:
  compile-full-and-link-wheel:
    name: compile-full-and-link-wheel
    runs-on: windows-2022

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap build job
        id: bootstrap
        uses: "./.github/actions/A00.fa-job-bootstrap"
        with:
          ninja-cache-restore: true
          build-variant: serial

      - name: Compile OPT_DIM full with ninja cache
        uses: "./.github/actions/A01.fa-build-with-cache"
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-primary-key: ${{ steps.bootstrap.outputs.cache-primary-key }}
          cache-exists: ${{ steps.bootstrap.outputs.cache-exists }}
          use-cache: ${{ env.USE_CACHE }}
          run: npx tsx scripts/cli.ts 06.compile --opt-dim "${{ env.CK_OPT_DIM }}" --fa-src $env:FA_SRC

      - name: Retry after watchdog abort
        if: always() && !cancelled() && env.ABORT_TRIGGERED == 'true' && env.COMPILE_COMPLETE != 'true' && env.ABORT_FORCE_KILLED != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/cli.ts 07-retry --build-variant serial

      - name: Write compile cache metadata
        if: success()
        shell: pwsh
        run: |
          $entry = [ordered]@{
            opt_dim = $env:CK_OPT_DIM
            key = '${{ steps.bootstrap.outputs.cache-key }}'
            exists = '${{ steps.bootstrap.outputs.cache-exists }}' -eq 'true'
            used = '${{ steps.bootstrap.outputs.cache-used }}' -eq 'true'
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $entry | ConvertTo-Json -Depth 3 -AsArray | Out-File -FilePath dist/build-caches.json -Encoding utf8

      - name: Link and package wheel from in-place objects
        if: success()
        shell: pwsh
        run: npx tsx scripts/cli.ts 09.wheel --fa-src $env:FA_SRC --dist-dir $env:GITHUB_WORKSPACE\dist

      - name: Verify wheel and publish
        if: success()
        uses: "./.github/actions/A99.fa-verify-publish"
        with:
          build-variant: serial
          build-caches: dist/build-caches.json
