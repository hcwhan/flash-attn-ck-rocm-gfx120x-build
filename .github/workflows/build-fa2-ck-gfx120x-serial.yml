name: Build FlashAttention CK serial (Windows gfx120x)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "单次全量 compile（lock CK_OPT_DIM）的 Ninja 并行 worker 数（OOM 时可改为 2）"
        required: false
        default: "4"
      use_cache:
        description: "存在匹配条目时恢复 ninja cache 到 build/（false 时 restore only-lookup 探测 exists）"
        type: boolean
        required: false
        default: true
      publish_release:
        description: "构建成功后上传到 GitHub Releases"
        type: boolean
        required: false
        default: true
      ck_disable_bwd:
        description: "设为 true 时省略 CK FMHA bwd codegen 并启用 FLASHATTENTION_DISABLE_BACKWARD（ComfyUI 推理专用）；默认 false 完整编译含 bwd"
        type: boolean
        required: false
        default: false
      retry_count:
        description: "看门狗 retry 计数（≥8 不再自动触发）"
        type: string
        required: false
        default: "0"

concurrency:
  group: build-fa2-ck-gfx120x-serial
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  FA_SRC: C:\fa\flash-attention
  USE_CACHE: ${{ github.event.inputs.use_cache != 'false' && 'true' || 'false' }}
  PUBLISH_RELEASE: ${{ github.event.inputs.publish_release != 'false' && 'true' || 'false' }}
  RETRY_COUNT: ${{ github.event.inputs.retry_count || '0' }}
  CK_DISABLE_BWD: ${{ github.event.inputs.ck_disable_bwd == 'true' && 'true' || 'false' }}

jobs:
  compile-full-and-link-wheel:
    name: compile-full-and-link-wheel
    runs-on: windows-2022

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Record job start
        id: job-start
        uses: hcwhan/actions/kit/watchdog/job-start@main

      - name: Bootstrap job
        id: bootstrap
        uses: "./.github/actions/A00.bootstrap-job"
        with:
          step-prep-source: "true"
          step-setup-toolchain: "true"
          step-restore-ninja-cache: "true"
          build-variant: serial

      - name: Compile OPT_DIM full and save cache
        id: build
        uses: "./.github/actions/A01.compile-with-cache"
        with:
          job-start-time: ${{ steps.job-start.outputs.job-start-time }}
          fa-src: ${{ env.FA_SRC }}
          opt-dim: ${{ env.CK_OPT_DIM }}
          cache-family-key: ${{ steps.bootstrap.outputs.cache-family-key }}
          cache-key: ${{ steps.bootstrap.outputs.cache-key }}
          use-cache: ${{ env.USE_CACHE }}

      - name: Retry after watchdog abort
        if: always() && !cancelled() && steps.build.outputs.should-retry == 'true'
        uses: hcwhan/actions/kit/watchdog/dispatch-retry@main
        with:
          should-retry: ${{ steps.build.outputs.should-retry }}
          use-cache: ${{ env.USE_CACHE }}
          retry-count: ${{ env.RETRY_COUNT }}
          workflow-file: build-fa2-ck-gfx120x-serial.yml
          dispatch-inputs: |
            {"ninja_workers":"${{ env.MAX_JOBS }}","use_cache":"${{ env.USE_CACHE }}","publish_release":"${{ env.PUBLISH_RELEASE }}","ck_disable_bwd":"${{ env.CK_DISABLE_BWD }}"}

      - name: Write compile success metadata
        if: success()
        shell: pwsh
        run: |
          $entry = [ordered]@{
            opt_dim = $env:CK_OPT_DIM
            key = '${{ steps.bootstrap.outputs.cache-key }}'
            exists = '${{ steps.bootstrap.outputs.cache-exists }}' -eq 'true'
            used = '${{ steps.bootstrap.outputs.cache-used }}' -eq 'true'
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $entry | ConvertTo-Json -Depth 3 -AsArray | Out-File -FilePath dist/compile-success-meta.json -Encoding utf8

      - name: Link wheel from in-place objects
        if: success()
        shell: pwsh
        run: npx tsx scripts/cli.ts 09.wheel --fa-src $env:FA_SRC --dist-dir $env:GITHUB_WORKSPACE\dist

      - name: Verify Wheel and Publish Release
        if: success()
        uses: "./.github/actions/A99.verify-and-publish"
        with:
          build-variant: serial
          build-meta: dist/compile-success-meta.json
