name: Build FlashAttention CK (Windows gfx1201)

on:
  workflow_dispatch:
    inputs:
      flash_attn_ref:
        description: "flash-attention git ref (tag/branch/commit)"
        required: false
        default: "main"
      max_jobs:
        description: "Parallel compile jobs (use 2 if OOM on hosted runner)"
        required: false
        default: "4"
  push:
    tags:
      - "fa-ck-v*"

concurrency:
  group: build-fa2-ck-gfx1201
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTORCH_VERSION: "2.12.0+rocm7.14.0"
  TORCH_DEVICE: "gfx1201"
  ROCM_INDEX: "https://repo.amd.com/rocm/whl-multi-arch/"
  GPU_ARCHS: "gfx1201"
  FLASH_ATTN_REF: ${{ github.event.inputs.flash_attn_ref || 'main' }}
  MAX_JOBS: ${{ github.event.inputs.max_jobs || '4' }}
  FA_SRC: C:\fa\flash-attention
  FA_ARTIFACT: fa-src-patched-gfx1201

jobs:
  prep:
    name: prep-fa-src
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Prepare patched flash-attention source
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\build\prep-flash-attention.ps1 `
            -FlashAttentionRoot $env:FA_SRC `
            -FlashAttentionRef $env:FLASH_ATTN_REF

      - name: Upload patched source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FA_ARTIFACT }}
          path: ${{ env.FA_SRC }}
          retention-days: 3
          if-no-files-found: error

  build:
    name: build-win-gfx1201
    needs: prep
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Upgrade pip tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools psutil packaging ninja

      - name: Install pinned PyTorch ROCm
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir `
            --index-url $env:ROCM_INDEX `
            "torch[device-${{ env.TORCH_DEVICE }}]==${{ env.PYTORCH_VERSION }}"

      - name: Install ROCm devel headers
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir `
            --index-url $env:ROCM_INDEX `
            "rocm[devel]==7.14.0"

      - name: Initialize ROCm devel tree
        shell: pwsh
        run: |
          python -m rocm_sdk init --quiet
          python -m rocm_sdk path --root
          python -c "from pathlib import Path; import subprocess; r=Path(subprocess.check_output(['python','-m','rocm_sdk','path','--root'], text=True).strip()); p=r/'include'/'thrust'/'complex.h'; print('thrust header:', p, p.is_file()); assert p.is_file()"

      - name: Verify torch and rocm toolchain
        shell: pwsh
        run: |
          python -c "import torch; print('torch', torch.__version__); print('hip', torch.version.hip); print('abi', torch._C._GLIBCXX_USE_CXX11_ABI)"
          python -c "import importlib.util, os; s=importlib.util.find_spec('_rocm_sdk_core'); print('rocm_sdk_core', os.path.dirname(s.origin))"

      - name: Download patched flash-attention source
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FA_ARTIFACT }}
          path: C:\fa

      - name: Restore ninja incremental build cache
        uses: actions/cache@v4
        id: fa-build-cache
        with:
          path: ${{ env.FA_SRC }}\build
          key: fa2-ck-gfx1201-v1-py${{ env.PYTHON_VERSION }}-${{ env.PYTORCH_VERSION }}-${{ env.GPU_ARCHS }}-inference-fwd-opt64256-${{ hashFiles('build/patch-fa-inference.ps1', 'build/setup-rocm-env.ps1') }}-${{ env.FLASH_ATTN_REF }}
          restore-keys: |
            fa2-ck-gfx1201-v1-py${{ env.PYTHON_VERSION }}-${{ env.PYTORCH_VERSION }}-${{ env.GPU_ARCHS }}-inference-fwd-opt64256-${{ hashFiles('build/patch-fa-inference.ps1', 'build/setup-rocm-env.ps1') }}-
            fa2-ck-gfx1201-v1-py${{ env.PYTHON_VERSION }}-${{ env.PYTORCH_VERSION }}-${{ env.GPU_ARCHS }}-
          save-always: true

      - name: Report cache status
        shell: pwsh
        run: |
          if ('${{ steps.fa-build-cache.outputs.cache-hit }}' -eq 'true') {
            Write-Host "Cache hit: resuming incremental ninja build"
          } else {
            Write-Host "Cache miss: starting fresh compile (re-run workflow to resume if timed out)"
          }
          if (Test-Path "$env:FA_SRC\build") {
            Get-ChildItem "$env:FA_SRC\build" -Recurse -Filter "*.obj" -ErrorAction SilentlyContinue |
              Measure-Object | ForEach-Object { Write-Host "Cached object files: $($_.Count)" }
          }

      - name: Build wheel
        shell: pwsh
        working-directory: ${{ env.FA_SRC }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE\dist | Out-Null
          python -m pip install numpy
          . $env:GITHUB_WORKSPACE\build\setup-rocm-env.ps1 -PythonExe python
          python -m pip wheel . --no-build-isolation --no-deps -w $env:GITHUB_WORKSPACE\dist -v
          Get-ChildItem $env:GITHUB_WORKSPACE\dist

      - name: CPU smoke test
        shell: pwsh
        run: |
          $whl = Get-ChildItem dist/*.whl | Select-Object -First 1
          if (-not $whl) { throw 'No wheel produced' }
          python -m pip install $whl.FullName
          python -c "from flash_attn import flash_attn_func; import flash_attn_2_cuda; print('OK', flash_attn_2_cuda.__file__); print([x for x in dir(flash_attn_2_cuda) if not x.startswith('_')])"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: flash-attn-ck-gfx1201-cp312-rocm714
          path: dist/*.whl
          retention-days: 30

      - name: Collect build logs on failure
        if: failure()
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE "build-logs"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          if (Test-Path "$env:GITHUB_WORKSPACE\dist") {
            Copy-Item -Recurse "$env:GITHUB_WORKSPACE\dist" (Join-Path $dest "dist")
          }
          if (Test-Path $env:FA_SRC\build) {
            Copy-Item -Recurse $env:FA_SRC\build (Join-Path $dest "fa-build")
          }

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-logs
          retention-days: 7
          if-no-files-found: ignore
