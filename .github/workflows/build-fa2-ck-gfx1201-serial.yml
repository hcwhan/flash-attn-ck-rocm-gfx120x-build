name: Build FlashAttention CK serial (Windows gfx1201)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "Ninja parallel compile workers per OPT_DIM full (use 2 if OOM)"
        required: false
        default: "4"
      skip_cache_restore:
        description: "Skip restoring ninja cache (build still saves cache after compile)"
        type: boolean
        required: false
        default: false

concurrency:
  group: build-fa2-ck-gfx1201-serial
  cancel-in-progress: true

# actions: write needed for the cache delete-and-refresh flow (REST API);
# contents: read keeps actions/checkout working (unspecified scopes default to none).
permissions:
  actions: write
  contents: read

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  FA_SRC: C:\fa\flash-attention
  FA_ARTIFACT: fa-src-patched-gfx1201
  SKIP_CACHE_RESTORE: ${{ github.event.inputs.skip_cache_restore != 'false' && 'true' || 'false' }}

jobs:
  prep:
    name: prep-fa-src
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Prepare patched flash-attention source
        uses: "./.github/actions/02.fa-prep-src"
        with:
          fa-src: ${{ env.FA_SRC }}
          artifact-name: ${{ env.FA_ARTIFACT }}

  build:
    name: compile-win-gfx1201-full
    needs: prep
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap toolchain and FA source
        uses: "./.github/actions/05.fa-job-bootstrap"
        with:
          fa-src: ${{ env.FA_SRC }}
          artifact-name: ${{ env.FA_ARTIFACT }}

      - name: Fingerprint toolchain for cache key
        id: msvc-fp
        uses: "./.github/actions/06.fa-toolchain-fingerprint"

      - name: Compile OPT_DIM full with ninja cache
        uses: "./.github/actions/08.fa-build-with-cache"
        with:
          fa-src: ${{ env.FA_SRC }}
          # Repository commit covers all build inputs that live in this repo
          # (scripts, VERSION.lock.json incl. the pinned FA commit); the runtime
          # fingerprints cover external inputs: MSVC/clang toolchain (image
          # updates) and the unpinned pip toolchain installs.
          # cache-key: fa2-ck-gfx1201-serial-v4-${{ github.sha }}-msvc${{ steps.msvc-fp.outputs.msvc-hash }}-pip${{ steps.msvc-fp.outputs.pip-hash }}
          cache-key: fa2-ck-gfx1201-serial-v4-msvc${{ steps.msvc-fp.outputs.msvc-hash }}-pip${{ steps.msvc-fp.outputs.pip-hash }}
          skip-restore: ${{ env.SKIP_CACHE_RESTORE }}
          run: |
            . "$env:GITHUB_WORKSPACE\build\5.compile - compile-opt-dim.ps1" `
              -OptDim "${{ env.LockOptDim }}" `
              -WorkspaceRoot $env:GITHUB_WORKSPACE `
              -FaSrc $env:FA_SRC

        # same as parallel link-wheel step, but use in-place objects
      - name: Link and package wheel from in-place objects
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE\build\7.wheel - build-bdist-wheel.ps1" `
            -FaSrc $env:FA_SRC `
            -DistDir $env:GITHUB_WORKSPACE\dist `
            -WorkspaceRoot $env:GITHUB_WORKSPACE
          Get-ChildItem $env:GITHUB_WORKSPACE\dist

      - name: Smoke test and upload wheel
        uses: "./.github/actions/10.fa-smoke-test-upload-wheel"
