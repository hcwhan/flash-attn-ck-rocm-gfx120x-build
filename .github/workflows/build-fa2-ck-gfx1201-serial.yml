name: Build FlashAttention CK serial (Windows gfx1201)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "Ninja parallel compile workers per OPT_DIM full (use 2 if OOM)"
        required: false
        default: "4"
      skip_cache_restore:
        description: "Skip restoring ninja cache (build still saves cache after compile)"
        type: boolean
        required: false
        default: false
      publish_release:
        description: "Upload wheel to GitHub Releases after successful build"
        type: boolean
        required: false
        default: true

concurrency:
  group: build-fa2-ck-gfx1201-serial
  cancel-in-progress: true

# actions: write needed for the cache delete-and-refresh flow (REST API);
# contents: write needed for GitHub Releases upload.
permissions:
  actions: write
  contents: write

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  FA_SRC: C:\fa\flash-attention
  SKIP_CACHE_RESTORE: ${{ github.event.inputs.skip_cache_restore != 'false' && 'true' || 'false' }}

jobs:
  compile-full-and-link:
    name: compile-full-and-link
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install npm dependencies
        shell: pwsh
        run: npm ci

      - name: Load VERSION.lock.json
        shell: pwsh
        run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

      - name: Clone and patch flash-attention source
        shell: pwsh
        run: |
          npx tsx scripts/cli.ts 03.prep --fa-src $env:FA_SRC
          npx tsx scripts/cli.ts 04.patch --fa-src $env:FA_SRC

      - name: Setup ROCm toolchain
        uses: "./.github/actions/01.fa-rocm-toolchain"
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pytorch-version: ${{ env.PYTORCH_VERSION }}
          torch-device-extra: ${{ env.TORCH_DEVICE_EXTRA }}
          rocm-index: ${{ env.ROCM_INDEX }}
          rocm-version: ${{ env.ROCM_VERSION }}
          pip-cache-key: ${{ env.PIP_TOOLCHAIN_CACHE_KEY }}

      - name: Fingerprint toolchain for cache key
        id: toolchain-fingerprint
        shell: pwsh
        run: npx tsx scripts/cli.ts 05.toolchain-fingerprint -w $env:GITHUB_WORKSPACE --build-variant serial

      - name: Compile OPT_DIM full with ninja cache
        id: compile-full
        uses: "./.github/actions/03.fa-build-with-cache"
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-key: ${{ steps.toolchain-fingerprint.outputs.cache-key }}
          skip-cache-restore: ${{ env.SKIP_CACHE_RESTORE }}
          run: npx tsx scripts/cli.ts 06.compile --opt-dim "${{ env.LOCK_OPT_DIM }}" --fa-src $env:FA_SRC

      - name: Link and package wheel from in-place objects
        shell: pwsh
        run: npx tsx scripts/cli.ts 08.wheel --fa-src $env:FA_SRC --dist-dir $env:GITHUB_WORKSPACE\dist

      - name: Write compile cache metadata
        shell: pwsh
        run: |
          $entry = [ordered]@{
            opt_dim = $env:LOCK_OPT_DIM
            key = '${{ steps.toolchain-fingerprint.outputs.cache-key }}'
            hit = '${{ steps.compile-full.outputs.cache-hit }}' -eq 'true'
            restore_skipped = $env:SKIP_CACHE_RESTORE -eq 'true'
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          @($entry) | ConvertTo-Json -Depth 3 | Out-File -FilePath dist/build-caches.json -Encoding utf8

      - name: Smoke test (CPU)
        shell: pwsh
        run: npx tsx scripts/cli.ts 09.verify --dist-dir $env:GITHUB_WORKSPACE\dist --build-variant serial --build-caches $env:GITHUB_WORKSPACE\dist\build-caches.json

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WHEEL_ARTIFACT_NAME }}
          path: |
            dist/*.whl
            dist/*.sha256
            dist/wheel.manifest.json
          retention-days: 30

      - name: Prepare release metadata
        if: ${{ github.event.inputs.publish_release != 'false' }}
        id: publish
        shell: pwsh
        run: npx tsx scripts/cli.ts 10.publish --dist-dir $env:GITHUB_WORKSPACE\dist --workflow-name "${{ github.workflow }}" --build-variant serial

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.publish_release != 'false' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.publish.outputs.release-tag }}
          name: ${{ steps.publish.outputs.release-title }}
          body_path: ${{ steps.publish.outputs.body-path }}
          files: |
            dist/*.whl
            dist/*.sha256
            dist/wheel.manifest.json
          prerelease: true
          make_latest: false
