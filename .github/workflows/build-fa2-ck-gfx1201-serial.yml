name: Build FlashAttention CK serial (Windows gfx1201)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "Ninja parallel compile workers per build job (use 2 if OOM on hosted runner)"
        required: false
        default: "4"
      skip_cache_restore:
        description: "Skip restoring ninja cache (build still saves cache after compile)"
        type: boolean
        required: false
        default: true

concurrency:
  group: build-fa2-ck-gfx1201-serial
  cancel-in-progress: true

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  FA_SRC: C:\fa\flash-attention
  FA_ARTIFACT: fa-src-patched-gfx1201
  FA_CACHE_HASH: ${{ hashFiles('build/patch/patch-fa-inference.ps1', 'build/env/setup-rocm-env.ps1', 'build/prep/prep-flash-attention.ps1', 'build/env/init-fa-build-env.ps1', 'build/config/read-version-lock.ps1', 'build/compile/compile-opt-dim.ps1', 'build/compile/link_parallel_wheel.py', 'build/wheel/build-bdist-wheel.ps1', 'build/common/paths.ps1', 'build/common/get-fa-release-dir.ps1', 'VERSION.lock.json') }}
  SKIP_CACHE_RESTORE: ${{ github.event.inputs.skip_cache_restore != false && 'true' || 'false' }}

jobs:
  prep:
    name: prep-fa-src
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      fa-commit-sha: ${{ steps.fa-prep.outputs.fa-commit-sha }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Prepare patched flash-attention source
        id: fa-prep
        uses: ./.github/actions/fa-prep-artifact
        with:
          fa-src: ${{ env.FA_SRC }}
          artifact-name: ${{ env.FA_ARTIFACT }}

  build:
    name: build-win-gfx1201
    needs: prep
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Bootstrap toolchain and FA source
        uses: ./.github/actions/fa-job-bootstrap
        with:
          fa-src: ${{ env.FA_SRC }}
          artifact-name: ${{ env.FA_ARTIFACT }}

      - name: Build wheel with ninja cache
        uses: ./.github/actions/fa-build-with-cache
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-key: fa2-ck-gfx1201-serial-v3-py${{ env.PYTHON_VERSION }}-${{ env.PYTORCH_VERSION }}-${{ env.GPU_ARCHS }}-inference-fwd-${{ env.FA_CACHE_HASH }}-${{ needs.prep.outputs.fa-commit-sha }}
          skip-restore: ${{ env.SKIP_CACHE_RESTORE }}
          run: |
            . $env:GITHUB_WORKSPACE\build\wheel\build-bdist-wheel.ps1 `
              -FaSrc $env:FA_SRC `
              -DistDir $env:GITHUB_WORKSPACE\dist `
              -WorkspaceRoot $env:GITHUB_WORKSPACE
            Get-ChildItem $env:GITHUB_WORKSPACE\dist

      - name: Smoke test and upload wheel
        uses: ./.github/actions/fa-smoke-test-upload-wheel
