name: Build FlashAttention CK serial (Windows gfx1201)

on:
  workflow_dispatch:
    inputs:
      flash_attn_ref:
        description: "flash-attention git ref (tag/branch/commit)"
        required: false
        default: "main"
      max_jobs:
        description: "Parallel compile jobs (use 2 if OOM on hosted runner)"
        required: false
        default: "4"
      use_locked_commit:
        description: "Pin FA source to VERSION.lock.json flash_attention_min_commit"
        required: false
        default: false
        type: boolean

concurrency:
  group: build-fa2-ck-gfx1201-serial
  cancel-in-progress: true

env:
  FLASH_ATTN_REF: ${{ github.event.inputs.flash_attn_ref || 'main' }}
  MAX_JOBS: ${{ github.event.inputs.max_jobs || '4' }}
  FA_SRC: C:\fa\flash-attention
  FA_ARTIFACT: fa-src-patched-gfx1201

jobs:
  prep:
    name: prep-fa-src
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      fa-commit-sha: ${{ steps.fa-prep.outputs.fa-commit-sha }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Prepare patched flash-attention source
        id: fa-prep
        uses: ./.github/actions/fa-prep-artifact
        with:
          flash-attn-ref: ${{ env.FLASH_ATTN_REF }}
          fa-src: ${{ env.FA_SRC }}
          artifact-name: ${{ env.FA_ARTIFACT }}
          use-locked-commit: ${{ github.event.inputs.use_locked_commit && 'true' || 'false' }}

  build:
    name: build-win-gfx1201
    needs: prep
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Load VERSION.lock.json
        uses: ./.github/actions/fa-read-version-lock

      - name: Setup ROCm toolchain
        uses: ./.github/actions/fa-rocm-toolchain
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pytorch-version: ${{ env.PYTORCH_VERSION }}
          torch-device: ${{ env.TORCH_DEVICE }}
          rocm-index: ${{ env.ROCM_INDEX }}
          rocm-version: ${{ env.HIP_VERSION }}

      - name: Download patched flash-attention source
        uses: ./.github/actions/fa-download-src
        with:
          artifact-name: ${{ env.FA_ARTIFACT }}
          fa-src: ${{ env.FA_SRC }}

      - name: Restore ninja incremental build cache
        id: fa-build-cache
        uses: ./.github/actions/fa-ninja-cache-restore
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-key: fa2-ck-gfx1201-serial-v2-py${{ env.PYTHON_VERSION }}-${{ env.PYTORCH_VERSION }}-${{ env.GPU_ARCHS }}-inference-fwd-${{ hashFiles('build/patch-fa-inference.ps1', 'build/setup-rocm-env.ps1', 'build/prep-flash-attention.ps1', 'build/init-fa-build-env.ps1', 'build/link_parallel_wheel.py', 'build/build-bdist-wheel.ps1') }}-${{ needs.prep.outputs.fa-commit-sha }}
          restore-keys: |
            fa2-ck-gfx1201-serial-v2-py${{ env.PYTHON_VERSION }}-${{ env.PYTORCH_VERSION }}-${{ env.GPU_ARCHS }}-inference-fwd-${{ hashFiles('build/patch-fa-inference.ps1', 'build/setup-rocm-env.ps1', 'build/prep-flash-attention.ps1', 'build/init-fa-build-env.ps1', 'build/link_parallel_wheel.py', 'build/build-bdist-wheel.ps1') }}-

      - name: Report cache status
        shell: pwsh
        run: |
          Write-Host "flash-attention commit: ${{ needs.prep.outputs.fa-commit-sha }}"
          if ('${{ steps.fa-build-cache.outputs.cache-hit }}' -eq 'true') {
            Write-Host "Cache hit: resuming incremental ninja build"
          } else {
            Write-Host "Cache miss: starting fresh compile (re-run workflow to resume if timed out)"
          }
          if (Test-Path "$env:FA_SRC\build") {
            Get-ChildItem "$env:FA_SRC\build" -Recurse -Filter "*.obj" -ErrorAction SilentlyContinue |
              Measure-Object | ForEach-Object { Write-Host "Cached object files: $($_.Count)" }
          }

      - name: Build wheel
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE\dist | Out-Null
          . $env:GITHUB_WORKSPACE\build\build-bdist-wheel.ps1 `
            -FaSrc $env:FA_SRC `
            -DistDir $env:GITHUB_WORKSPACE\dist `
            -WorkspaceRoot $env:GITHUB_WORKSPACE
          Get-ChildItem $env:GITHUB_WORKSPACE\dist

      - name: Save ninja incremental build cache
        if: always()
        uses: ./.github/actions/fa-ninja-cache-save
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-primary-key: ${{ steps.fa-build-cache.outputs.cache-primary-key }}

      - name: CPU smoke test
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\build\smoke-test-wheel.ps1 `
            -DistDir $env:GITHUB_WORKSPACE\dist `
            -WorkspaceRoot $env:GITHUB_WORKSPACE

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: flash-attn-ck-gfx1201-cp312-rocm714
          path: dist/*.whl
          retention-days: 30

      - name: Collect build logs on failure
        if: failure()
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE "build-logs"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          if (Test-Path "$env:GITHUB_WORKSPACE\dist") {
            Copy-Item -Recurse "$env:GITHUB_WORKSPACE\dist" (Join-Path $dest "dist")
          }
          if (Test-Path $env:FA_SRC\build) {
            Copy-Item -Recurse $env:FA_SRC\build (Join-Path $dest "fa-build")
          }

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: build-logs
          retention-days: 7
          if-no-files-found: ignore
