name: Build FlashAttention CK serial (Windows gfx1201)

on:
  workflow_dispatch:
    inputs:
      ninja_workers:
        description: "Ninja parallel compile workers per OPT_DIM full (use 2 if OOM)"
        required: false
        default: "4"
      skip_cache_restore:
        description: "Skip restoring ninja cache (build still saves cache after compile)"
        type: boolean
        required: false
        default: false
      publish_release:
        description: "Upload wheel to GitHub Releases after successful build"
        type: boolean
        required: false
        default: true

concurrency:
  group: build-fa2-ck-gfx1201-serial
  cancel-in-progress: true

# actions: write needed for the cache delete-and-refresh flow (REST API);
# contents: write needed for GitHub Releases upload.
permissions:
  actions: write
  contents: write

env:
  MAX_JOBS: ${{ github.event.inputs.ninja_workers }}
  FA_SRC: C:\fa\flash-attention
  FA_ARTIFACT: fa-src-patched-gfx1201
  SKIP_CACHE_RESTORE: ${{ github.event.inputs.skip_cache_restore != 'false' && 'true' || 'false' }}

jobs:
  prep:
    name: prep-fa-src
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install npm dependencies
        shell: pwsh
        run: npm ci

      - name: Load VERSION.lock.json
        shell: pwsh
        run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

      - name: Clone flash-attention source
        shell: pwsh
        run: npx tsx scripts/cli.ts 03.prep --flash-attention-root $env:FA_SRC

      - name: Patch flash-attention for inference-only build
        shell: pwsh
        run: npx tsx scripts/cli.ts 04.patch --flash-attention-root $env:FA_SRC

      - name: Upload patched source artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FA_ARTIFACT }}
          path: ${{ env.FA_SRC }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 9

  build:
    name: compile-full
    needs: prep
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install npm dependencies
        shell: pwsh
        run: npm ci

      - name: Load VERSION.lock.json
        shell: pwsh
        run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

      - name: Setup ROCm toolchain
        uses: "./.github/actions/01.fa-rocm-toolchain"
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pytorch-version: ${{ env.PYTORCH_VERSION }}
          torch-device: ${{ env.TORCH_DEVICE }}
          rocm-index: ${{ env.ROCM_INDEX }}
          rocm-version: ${{ env.HIP_VERSION }}

      - name: Download patched flash-attention source
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.FA_ARTIFACT }}
          path: ${{ env.FA_SRC }}

      - name: Fingerprint toolchain for cache key
        id: toolchain-fingerprint
        shell: pwsh
        run: npx tsx scripts/cli.ts 05.toolchain-fingerprint --cache-variant serial

      - name: Compile OPT_DIM full with ninja cache
        uses: "./.github/actions/03.fa-build-with-cache"
        with:
          fa-src: ${{ env.FA_SRC }}
          cache-key: ${{ steps.toolchain-fingerprint.outputs.cache-key }}
          skip-restore: ${{ env.SKIP_CACHE_RESTORE }}
          run: npx tsx scripts/cli.ts 06.compile --opt-dim "${{ env.LockOptDim }}" --fa-src $env:FA_SRC

      - name: Link and package wheel from in-place objects
        shell: pwsh
        run: npx tsx scripts/cli.ts 08.wheel --fa-src $env:FA_SRC --dist-dir $env:GITHUB_WORKSPACE\dist

      - name: Smoke test (CPU)
        shell: pwsh
        run: npx tsx scripts/cli.ts 09.verify --dist-dir $env:GITHUB_WORKSPACE\dist --release-variant serial --ninja-cache-key "${{ steps.toolchain-fingerprint.outputs.cache-key }}"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WHEEL_ARTIFACT_NAME }}
          path: |
            dist/*.whl
            dist/*.sha256
            dist/wheel.manifest.json
          retention-days: 30

      - name: Prepare release metadata
        if: ${{ github.event.inputs.publish_release != 'false' }}
        id: publish
        shell: pwsh
        run: npx tsx scripts/cli.ts 10.publish --dist-dir $env:GITHUB_WORKSPACE\dist --workflow-name "${{ github.workflow }}" --release-variant serial

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.publish_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.publish.outputs.tag }}
          name: ${{ steps.publish.outputs.release_title }}
          body_path: ${{ steps.publish.outputs.body_path }}
          files: |
            dist/*.whl
            dist/*.sha256
            dist/wheel.manifest.json
          prerelease: true
          make_latest: false
