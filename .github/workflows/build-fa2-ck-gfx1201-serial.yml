name: Build FlashAttention CK serial (Windows gfx1201)

on:
  workflow_dispatch:
    inputs:
      flash_attn_ref:
        description: "flash-attention git ref (tag/branch/commit)"
        required: false
        default: "main"
      max_jobs:
        description: "Parallel compile jobs (use 2 if OOM on hosted runner)"
        required: false
        default: "4"
  push:
    tags:
      - "fa-ck-v*"

concurrency:
  group: build-fa2-ck-gfx1201-serial
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTORCH_VERSION: "2.12.0+rocm7.14.0"
  TORCH_DEVICE: "gfx1201"
  ROCM_INDEX: "https://repo.amd.com/rocm/whl-multi-arch/"
  GPU_ARCHS: "gfx1201"
  FLASH_ATTN_REF: ${{ github.event.inputs.flash_attn_ref || 'main' }}
  MAX_JOBS: ${{ github.event.inputs.max_jobs || '4' }}
  FA_SRC: C:\fa\flash-attention
  FA_ARTIFACT: fa-src-patched-gfx1201

jobs:
  prep:
    name: prep-fa-src
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Prepare patched flash-attention source
        uses: ./.github/actions/fa-prep-artifact
        with:
          flash-attn-ref: ${{ env.FLASH_ATTN_REF }}
          fa-src: ${{ env.FA_SRC }}
          artifact-name: ${{ env.FA_ARTIFACT }}

  build:
    name: build-win-gfx1201
    needs: prep
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v7

      - name: Setup ROCm toolchain
        uses: ./.github/actions/fa-rocm-toolchain
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          pytorch-version: ${{ env.PYTORCH_VERSION }}
          torch-device: ${{ env.TORCH_DEVICE }}
          rocm-index: ${{ env.ROCM_INDEX }}

      - name: Download patched flash-attention source
        uses: ./.github/actions/fa-download-src
        with:
          artifact-name: ${{ env.FA_ARTIFACT }}
          fa-src: ${{ env.FA_SRC }}

      - name: Restore ninja incremental build cache
        uses: actions/cache@v6
        id: fa-build-cache
        with:
          path: ${{ env.FA_SRC }}\build
          key: fa2-ck-gfx1201-v1-py${{ env.PYTHON_VERSION }}-${{ env.PYTORCH_VERSION }}-${{ env.GPU_ARCHS }}-inference-fwd-opt3264256-${{ hashFiles('build/patch-fa-inference.ps1', 'build/setup-rocm-env.ps1') }}-${{ env.FLASH_ATTN_REF }}
          restore-keys: |
            fa2-ck-gfx1201-v1-py${{ env.PYTHON_VERSION }}-${{ env.PYTORCH_VERSION }}-${{ env.GPU_ARCHS }}-inference-fwd-opt3264256-${{ hashFiles('build/patch-fa-inference.ps1', 'build/setup-rocm-env.ps1') }}-
            fa2-ck-gfx1201-v1-py${{ env.PYTHON_VERSION }}-${{ env.PYTORCH_VERSION }}-${{ env.GPU_ARCHS }}-
          save-always: true

      - name: Report cache status
        shell: pwsh
        run: |
          if ('${{ steps.fa-build-cache.outputs.cache-hit }}' -eq 'true') {
            Write-Host "Cache hit: resuming incremental ninja build"
          } else {
            Write-Host "Cache miss: starting fresh compile (re-run workflow to resume if timed out)"
          }
          if (Test-Path "$env:FA_SRC\build") {
            Get-ChildItem "$env:FA_SRC\build" -Recurse -Filter "*.obj" -ErrorAction SilentlyContinue |
              Measure-Object | ForEach-Object { Write-Host "Cached object files: $($_.Count)" }
          }

      - name: Build wheel
        shell: pwsh
        working-directory: ${{ env.FA_SRC }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE\dist | Out-Null
          python -m pip install numpy
          . $env:GITHUB_WORKSPACE\build\setup-rocm-env.ps1 -PythonExe python
          python -m pip wheel . --no-build-isolation --no-deps -w $env:GITHUB_WORKSPACE\dist -v
          Get-ChildItem $env:GITHUB_WORKSPACE\dist

      - name: CPU smoke test
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\build\smoke-test-wheel.ps1 -DistDir $env:GITHUB_WORKSPACE\dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: flash-attn-ck-gfx1201-cp312-rocm714
          path: dist/*.whl
          retention-days: 30

      - name: Collect build logs on failure
        if: failure()
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE "build-logs"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          if (Test-Path "$env:GITHUB_WORKSPACE\dist") {
            Copy-Item -Recurse "$env:GITHUB_WORKSPACE\dist" (Join-Path $dest "dist")
          }
          if (Test-Path $env:FA_SRC\build) {
            Copy-Item -Recurse $env:FA_SRC\build (Join-Path $dest "fa-build")
          }

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: build-logs
          retention-days: 7
          if-no-files-found: ignore
