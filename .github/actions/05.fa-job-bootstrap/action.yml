name: FA job bootstrap
description: Load VERSION.lock.json, setup ROCm toolchain, and download patched flash-attention source

inputs:
  fa-src:
    description: Absolute path to flash-attention source root
    required: true
  artifact-name:
    description: Prep artifact name from 02.fa-prep-src
    required: true

runs:
  using: composite
  steps:
    - name: Load VERSION.lock.json
      uses: "./.github/actions/01.fa-read-version-lock"

    - name: Setup ROCm toolchain
      uses: "./.github/actions/03.fa-rocm-toolchain"
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        pytorch-version: ${{ env.PYTORCH_VERSION }}
        torch-device: ${{ env.TORCH_DEVICE }}
        rocm-index: ${{ env.ROCM_INDEX }}
        rocm-version: ${{ env.HIP_VERSION }}

    - name: Download patched flash-attention source
      uses: "./.github/actions/04.fa-download-src"
      with:
        artifact-name: ${{ inputs.artifact-name }}
        fa-src: ${{ inputs.fa-src }}
