name: FA MSVC toolset fingerprint
description: Emit a short SHA-256 of the installed MSVC VC tools version for ninja cache key isolation (windows-2022 image updates change the toolset; objects compiled with a different toolset must not be reused)

outputs:
  msvc-hash:
    description: 12-hex fingerprint of the MSVC VC tools version
    value: ${{ steps.fp.outputs.msvc-hash }}

runs:
  using: composite
  steps:
    - name: Fingerprint MSVC VC tools version
      id: fp
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $toolset = 'unknown'
        if (Test-Path $vswhere) {
          $vcRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $toolsDir = Join-Path $vcRoot 'VC\Tools\MSVC'
          if ($vcRoot -and (Test-Path $toolsDir)) {
            $toolset = (Get-ChildItem $toolsDir -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          }
        }
        $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($toolset))).Substring(0, 12).ToLowerInvariant()
        Write-Host "MSVC toolset: $toolset (cache fingerprint $hash)"
        "msvc-hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
