name: FA upload GitHub Release
description: Publish dist wheel bundle to GitHub Releases (tag from VERSION.lock.json)

inputs:
  dist-dir:
    description: Directory containing wheel, sha256, and wheel.manifest.json
    required: true
  workflow-name:
    description: Workflow display name for release notes
    required: true

runs:
  using: composite
  steps:
    - name: Prepare release metadata
      id: release
      shell: pwsh
      run: |
        . "$env:GITHUB_WORKSPACE\build\10.publish - github-release.ps1" `
          -DistDir "${{ inputs.dist-dir }}" `
          -WorkspaceRoot $env:GITHUB_WORKSPACE `
          -WorkflowName "${{ inputs.workflow-name }}"

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release.outputs.tag }}
        name: ${{ steps.release.outputs.release_name }} (build ${{ github.run_number }})
        body_path: ${{ steps.release.outputs.body_path }}
        files: |
          ${{ inputs.dist-dir }}/*.whl
          ${{ inputs.dist-dir }}/*.sha256
          ${{ inputs.dist-dir }}/wheel.manifest.json
        prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
        make_latest: false
