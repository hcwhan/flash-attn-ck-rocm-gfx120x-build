name: Save FA ninja build cache
description: compile 步骤成功后保存 flash-attention build/ 增量 cache（job 超时/取消会跳过后续步骤，故不会 save）

inputs:
  fa-src:
    description: flash-attention 源码根目录
    required: true
  cache-primary-key:
    description: A02.fa-ninja-cache-restore 的 cache-primary-key
    required: true

runs:
  using: composite
  steps:
    - name: Save ninja incremental build cache
      if: inputs.cache-primary-key != ''
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.fa-src }}\build
        key: ${{ inputs.cache-primary-key }}
