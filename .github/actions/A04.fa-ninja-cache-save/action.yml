name: Save FA ninja build cache
description: 保存 flash-attention build/ 增量 cache（由 A03.fa-build-with-cache 调用；parallel 每 shard 独立 key）

inputs:
  fa-src:
    description: flash-attention 源码根目录
    required: true
  cache-primary-key:
    description: A02.fa-ninja-cache-restore 输出的 cache-primary-key（与 05.toolchain-fingerprint 的 cache-key 一致）
    required: true

runs:
  using: composite
  steps:
    - name: Persist build directory to cache
      if: inputs.cache-primary-key != ''
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.fa-src }}\build
        key: ${{ inputs.cache-primary-key }}
