name: FA build with ninja cache
description: 运行构建 CLI；save 前 delete stale 条目；由 A04.fa-ninja-cache-save 保存 ninja cache

inputs:
  fa-src:
    description: flash-attention 源码根目录
    required: true
  cache-primary-key:
    description: A02.fa-ninja-cache-restore 的 cache-primary-key
    required: true
  cache-exists:
    description: A02.fa-ninja-cache-restore 的 cache-exists（true 时 save 前先 delete 旧条目）
    required: false
    default: "false"
  use-cache:
    description: true 时在 build 非 skipped 时 save；false 时仅 compile 成功时 save
    required: false
    default: "true"
  run:
    description: 构建 shell 脚本
    required: true

runs:
  using: composite
  steps:
    - name: Run build CLI step
      id: run-build
      shell: pwsh
      run: ${{ inputs.run }}

    - name: Delete stale ninja cache entry
      # cache-exists 时先 delete，以便 save 刷新（actions/cache/save 对已存在 key 会失败）。
      # use-cache=true：成功或失败均 delete（允许部分 save）。
      # use-cache=false：仅成功时 delete（仅 lookup 冷构建刷新路径）。
      if: always() && steps.run-build.conclusion != 'skipped' && (inputs.use-cache == 'true' || steps.run-build.conclusion == 'success') && inputs.cache-exists == 'true' && inputs.cache-primary-key != '' && env.ABORT_FORCE_KILLED != 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $key = [uri]::EscapeDataString('${{ inputs.cache-primary-key }}')
        $ref = [uri]::EscapeDataString('${{ github.ref }}')
        gh api --method DELETE "/repos/${{ github.repository }}/actions/caches?key=$key&ref=$ref"
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to delete stale ninja cache entry (key=$key, ref=$ref, exit=$LASTEXITCODE)"
          exit $LASTEXITCODE
        }

    - name: Save ninja incremental build cache
      if: always() && steps.run-build.conclusion != 'skipped' && (inputs.use-cache == 'true' || steps.run-build.conclusion == 'success') && inputs.cache-primary-key != '' && env.ABORT_FORCE_KILLED != 'true'
      uses: "./.github/actions/A04.fa-ninja-cache-save"
      with:
        fa-src: ${{ inputs.fa-src }}
        cache-primary-key: ${{ inputs.cache-primary-key }}
