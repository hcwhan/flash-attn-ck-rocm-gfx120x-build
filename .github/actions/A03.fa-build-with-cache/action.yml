name: FA build with ninja cache
description: 恢复 ninja cache、运行构建 CLI 步骤、再保存 cache

inputs:
  fa-src:
    description: flash-attention 源码根目录
    required: true
  cache-key:
    description: 05.toolchain-fingerprint 主 cache key（serial-v5 / parallel-v5-d{dim} + 工具链指纹）
    required: true
  use-cache:
    description: true 时在条目存在时从 cache 恢复 build/；false 时仅 lookup
    required: false
    default: "true"
  run:
    description: cache 恢复与保存之间执行的 shell 脚本
    required: true

outputs:
  cache-exists:
    description: 远端存在 cache-primary-key 对应 cache 条目
    value: ${{ steps.fa-build-cache.outputs.cache-exists }}
  cache-used:
    description: 已将 cache 恢复到 build/
    value: ${{ steps.fa-build-cache.outputs.cache-used }}

runs:
  using: composite
  steps:
    - name: Restore ninja incremental build cache
      id: fa-build-cache
      uses: "./.github/actions/A02.fa-ninja-cache-restore"
      with:
        fa-src: ${{ inputs.fa-src }}
        cache-key: ${{ inputs.cache-key }}
        use-cache: ${{ inputs.use-cache }}

    - name: Run build CLI step
      id: run-build
      shell: pwsh
      run: ${{ inputs.run }}

    - name: Delete stale ninja cache entry
      # 远端条目存在且 compile 成功时先删除，以便 save 刷新
      # （actions/cache/save 在 key 已存在时会 hard fail）。
      if: always() && steps.run-build.conclusion == 'success' && steps.fa-build-cache.outputs.cache-exists == 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $key = [uri]::EscapeDataString('${{ steps.fa-build-cache.outputs.cache-primary-key }}')
        $ref = [uri]::EscapeDataString('${{ github.ref }}')
        gh api --method DELETE "/repos/${{ github.repository }}/actions/caches?key=$key&ref=$ref"
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to delete stale ninja cache entry (key=$key, ref=$ref, exit=$LASTEXITCODE)"
          exit $LASTEXITCODE
        }

    - name: Save ninja incremental build cache
      if: always() && steps.run-build.conclusion == 'success'
      uses: "./.github/actions/A04.fa-ninja-cache-save"
      with:
        fa-src: ${{ inputs.fa-src }}
        cache-primary-key: ${{ steps.fa-build-cache.outputs.cache-primary-key }}
