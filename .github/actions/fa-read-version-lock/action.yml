name: Read VERSION.lock.json
description: Load pinned toolchain versions from VERSION.lock.json into GITHUB_ENV

runs:
  using: composite
  steps:
    - name: Load VERSION.lock.json
      shell: pwsh
      run: |
        . $env:GITHUB_WORKSPACE\build\read-version-lock.ps1 `
          -WorkspaceRoot $env:GITHUB_WORKSPACE `
          -ExportToGitHubEnv
