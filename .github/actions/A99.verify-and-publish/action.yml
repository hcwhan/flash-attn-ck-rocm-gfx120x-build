name: Verify Wheel and Publish Release
description: Wheel 收尾：10.verify + upload artifact；publish_release≠false 时 11.publish + GitHub Release。

inputs:
  build-variant:
    description: serial 或 parallel（10.verify / 11.publish --build-variant）
    required: true
  build-meta:
    description: 10.verify --build-meta 相对 GITHUB_WORKSPACE 的路径（serial dist/compile-success-meta.json / parallel compile-success-meta）
    required: true

runs:
  using: composite
  steps:
    - name: Smoke test (CPU)
      shell: pwsh
      run: |
        $distDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
        $buildMeta = Join-Path $env:GITHUB_WORKSPACE '${{ inputs.build-meta }}'
        npx tsx scripts/cli.ts 10.verify --dist-dir $distDir --build-variant ${{ inputs.build-variant }} --build-meta $buildMeta

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.WHEEL_ARTIFACT_NAME }}
        path: |
          dist/*.whl
          dist/*.sha256
          dist/wheel.manifest.json
        retention-days: 7

    - name: Prepare release metadata
      if: ${{ github.event.inputs.publish_release != 'false' }}
      id: publish
      shell: pwsh
      run: |
        $distDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
        npx tsx scripts/cli.ts 11.publish --dist-dir $distDir --workflow-name "${{ github.workflow }}" --build-variant ${{ inputs.build-variant }}

    - name: Publish GitHub Release
      if: ${{ github.event.inputs.publish_release != 'false' }}
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.publish.outputs.release-tag }}
        name: ${{ steps.publish.outputs.release-title }}
        body_path: ${{ steps.publish.outputs.body-path }}
        files: |
          dist/*.whl
          dist/*.sha256
          dist/wheel.manifest.json
        prerelease: false
        make_latest: false
