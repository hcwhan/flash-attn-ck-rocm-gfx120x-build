name: FA ROCm toolchain
description: Python, MSVC, PyTorch ROCm, and rocm[devel] for flash-attn Windows builds

inputs:
  python-version:
    description: Python version
    required: true
  pytorch-version:
    description: PyTorch version string
    required: true
  torch-device:
    description: torch[device-*] extra name
    required: true
  rocm-index:
    description: pip index URL for ROCm wheels
    required: true
  rocm-version:
    description: rocm[devel] package version (from VERSION.lock.json hip)
    required: true

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Upgrade pip tooling
      shell: pwsh
      run: |
        python -m pip install --upgrade pip wheel setuptools psutil packaging ninja

    - name: Install pinned PyTorch ROCm
      shell: pwsh
      run: |
        python -m pip install --no-cache-dir `
          --index-url ${{ inputs.rocm-index }} `
          "torch[device-${{ inputs.torch-device }}]==${{ inputs.pytorch-version }}"

    - name: Install ROCm devel headers
      shell: pwsh
      run: |
        python -m pip install --no-cache-dir `
          --index-url ${{ inputs.rocm-index }} `
          "rocm[devel]==${{ inputs.rocm-version }}"

    - name: Initialize ROCm devel tree
      shell: pwsh
      run: |
        python -m rocm_sdk init --quiet
        python -m rocm_sdk path --root
