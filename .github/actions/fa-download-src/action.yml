name: Download patched flash-attention source
description: Restore prep artifact into FA_SRC

inputs:
  artifact-name:
    description: Artifact name from prep job
    required: true
  fa-src:
    description: Absolute path to flash-attention source root
    required: true

runs:
  using: composite
  steps:
    - name: Ensure source parent directory
      shell: pwsh
      run: |
        $parent = Split-Path -Parent "${{ inputs.fa-src }}"
        New-Item -ItemType Directory -Force -Path $parent | Out-Null

    - name: Download patched flash-attention source
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.fa-src }}
