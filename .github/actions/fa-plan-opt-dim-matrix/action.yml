name: Plan OPT_DIM matrix from VERSION.lock.json
description: Load opt_dim tiers from VERSION.lock.json and export matrix outputs for parallel compile

outputs:
  opt-dims-json:
    description: JSON array of OPT_DIM shard values
    value: ${{ steps.plan.outputs.opt_dims_json }}
  primary-opt-dim:
    description: First opt_dim tier used as primary shared-object shard
    value: ${{ steps.plan.outputs.primary_opt_dim }}

runs:
  using: composite
  steps:
    - name: Plan OPT_DIM matrix
      id: plan
      shell: pwsh
      run: |
        . $env:GITHUB_WORKSPACE\build\config\read-version-lock.ps1 -WorkspaceRoot $env:GITHUB_WORKSPACE
        $json = ConvertTo-Json -InputObject @($OptDimList) -Compress
        Write-Host "OPT_DIM matrix from lock: $json"
        Write-Host "Primary OPT_DIM shard: $PRIMARY_OPT_DIM"
        "opt_dims_json=$json" >> $env:GITHUB_OUTPUT
        "primary_opt_dim=$PRIMARY_OPT_DIM" >> $env:GITHUB_OUTPUT
