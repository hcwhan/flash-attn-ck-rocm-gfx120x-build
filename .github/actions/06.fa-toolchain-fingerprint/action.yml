name: FA toolchain fingerprint
description: Emit short SHA-256 fingerprints of the MSVC VC tools version, ROCm clang version, and installed pip toolchain for ninja cache key isolation (windows-2022 image updates change the MSVC toolset; the pip-pinned rocm[devel] ships the clang compiler; pip toolchain installs are unpinned). Objects compiled with a different toolchain must not be reused

outputs:
  msvc-hash:
    description: 12-hex fingerprint of the MSVC VC tools version + ROCm clang version
    value: ${{ steps.fp.outputs.msvc-hash }}
  pip-hash:
    description: 12-hex fingerprint of the installed pip toolchain (pip/setuptools/wheel/ninja/packaging/psutil)
    value: ${{ steps.fp.outputs.pip-hash }}

runs:
  using: composite
  steps:
    - name: Fingerprint MSVC VC tools + ROCm clang version
      id: fp
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $toolset = 'unknown'
        if (Test-Path $vswhere) {
          $vcRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $toolsDir = Join-Path $vcRoot 'VC\Tools\MSVC'
          if ($vcRoot -and (Test-Path $toolsDir)) {
            $toolset = (Get-ChildItem $toolsDir -Directory |
              Sort-Object { try { [version]$_ } catch { [version]'0.0' } } -Descending |
              Select-Object -First 1).Name
          }
        }
        # ROCm clang (installed by 03.fa-rocm-toolchain before this step); guards the
        # cache against toolchain drift inside the pinned rocm[devel] version.
        $clangVersion = 'unknown'
        . "$env:GITHUB_WORKSPACE\build\4.sdk - get-rocm-sdk-paths.ps1" -PythonExe python
        $clangExe = Join-Path $script:CoreRoot 'lib\llvm\bin\clang.exe'
        if (Test-Path $clangExe) {
          $clangVersion = (& $clangExe --version 2>$null | Select-Object -First 1)
        }
        $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes("$toolset|$clangVersion"))).Substring(0, 12).ToLowerInvariant()
        Write-Host "MSVC toolset: $toolset | clang: $clangVersion (cache fingerprint $hash)"
        "msvc-hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

        # pip toolchain fingerprint: pip/setuptools/wheel/ninja/packaging/psutil are
        # installed unpinned by 03.fa-rocm-toolchain, so their versions are external
        # inputs that change compiled output -- observe at runtime like the
        # MSVC/clang toolchain instead of trusting an unpinned install.
        $pipPkgs = @('pip', 'setuptools', 'wheel', 'ninja', 'packaging', 'psutil')
        $pipFreeze = python -m pip freeze 2>$null
        $pipVersions = foreach ($pkg in $pipPkgs) {
            $line = $pipFreeze | Where-Object { $_ -like "$pkg==*" } | Select-Object -First 1
            if (-not $line) {
                throw "pip toolchain package not found: $pkg"
            }
            $line
        }
        $pipHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes(($pipVersions | Sort-Object) -join ';'))).Substring(0, 12).ToLowerInvariant()
        Write-Host "pip toolchain: $($pipVersions -join ';') (fingerprint $pipHash)"
        "pip-hash=$pipHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
