name: Prepare and upload patched flash-attention source
description: Clone, patch, and upload flash-attention source artifact

inputs:
  flash-attn-ref:
    description: flash-attention git ref (branch, tag, or commit SHA)
    required: true
  fa-src:
    description: Absolute path for flash-attention checkout
    required: true
  artifact-name:
    description: Artifact name for upload-artifact
    required: true
  use-locked-commit:
    description: Use flash_attention_min_commit from VERSION.lock.json
    required: false
    default: "false"

outputs:
  fa-commit-sha:
    description: Resolved flash-attention commit SHA after clone and patch
    value: ${{ steps.prep.outputs.fa-commit-sha }}

runs:
  using: composite
  steps:
    - name: Prepare patched flash-attention source
      id: prep
      shell: pwsh
      run: |
        $params = @{
          FlashAttentionRoot = "${{ inputs.fa-src }}"
          FlashAttentionRef  = "${{ inputs.flash-attn-ref }}"
          WorkspaceRoot      = $env:GITHUB_WORKSPACE
        }
        if ('${{ inputs.use-locked-commit }}' -eq 'true') {
          $params.UseLockedCommit = $true
        }
        . $env:GITHUB_WORKSPACE\build\prep-flash-attention.ps1 @params

    - name: Upload patched source artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.fa-src }}
        retention-days: 7
        if-no-files-found: error
