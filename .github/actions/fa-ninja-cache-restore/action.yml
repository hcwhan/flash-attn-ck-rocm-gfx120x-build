name: Restore FA ninja build cache
description: Restore flash-attention build/ incremental cache (exact cache-key match only; no cross-commit restore-keys fallback)

inputs:
  fa-src:
    description: flash-attention source root
    required: true
  cache-key:
    description: Primary cache key (must include resolved flash-attention commit SHA)
    required: true

outputs:
  cache-hit:
    description: Exact cache key match
    value: ${{ steps.fa-build-cache.outputs.cache-hit }}
  cache-primary-key:
    description: Resolved primary cache key
    value: ${{ steps.fa-build-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Restore ninja incremental build cache
      uses: actions/cache/restore@v6
      id: fa-build-cache
      with:
        path: ${{ inputs.fa-src }}\build
        key: ${{ inputs.cache-key }}
