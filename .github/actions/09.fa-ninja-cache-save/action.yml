name: Save FA ninja build cache
description: Save flash-attention build/ incremental cache (runs on success or step failure; a job timeout/cancellation stops all steps, so no save happens then)

inputs:
  fa-src:
    description: flash-attention source root
    required: true
  cache-primary-key:
    description: cache-primary-key from 07.fa-ninja-cache-restore
    required: true

runs:
  using: composite
  steps:
    - name: Save ninja incremental build cache
      if: inputs.cache-primary-key != ''
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.fa-src }}\build
        key: ${{ inputs.cache-primary-key }}
