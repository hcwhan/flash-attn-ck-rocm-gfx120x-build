name: FA smoke test and upload wheel
description: Run CPU smoke test on dist/*.whl and upload wheel artifact

runs:
  using: composite
  steps:
    - name: CPU smoke test
      shell: pwsh
      run: |
        . $env:GITHUB_WORKSPACE\build\test\smoke-test-wheel.ps1 `
          -DistDir $env:GITHUB_WORKSPACE\dist `
          -WorkspaceRoot $env:GITHUB_WORKSPACE

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.WHEEL_ARTIFACT_NAME }}
        path: |
          dist/*.whl
          dist/*.sha256
          dist/wheel.manifest.json
        retention-days: 30
