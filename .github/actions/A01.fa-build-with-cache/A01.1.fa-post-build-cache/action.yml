name: FA post-build ninja cache save
description: compile 后保存 ninja cache（清理与 verify 由 hcwhan/actions/kit/cache 默认 cleanup-stale 处理；由调用方 gate 执行条件）

inputs:
  fa-src:
    description: flash-attention 源码根目录
    required: true
  cache-family-key:
    description: 05.toolchain-fingerprint 输出的 ninja cache family-key
    required: true
  cache-key:
    description: 05.toolchain-fingerprint 输出的 ninja cache key
    required: true

runs:
  using: composite
  steps:
    - name: Save ninja incremental build cache
      uses: hcwhan/actions/kit/cache/save@main
      with:
        path: ${{ inputs.fa-src }}\build
        family-key: ${{ inputs.cache-family-key }}
        cache-key: ${{ inputs.cache-key }}
