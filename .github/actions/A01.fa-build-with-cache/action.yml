name: FA build with ninja cache
description: prepare 编译命令 + watchdog/run + post-build ninja cache save（use_cache=true 时 compile 非 skipped 即 save；false 时仅成功 save）

inputs:
  fa-src:
    description: flash-attention 源码根目录
    required: true
  opt-dim:
    description: 编译 OPT_DIM（serial 为 lock 全量；parallel 为 matrix shard）
    required: true
  cache-family-key:
    description: A00 bootstrap 输出的 cache-family-key
    required: true
  cache-key:
    description: A00 bootstrap 输出的 cache-key
    required: true
  use-cache:
    description: true 时在 build 非 skipped 时 save；false 时仅 compile 成功时 save
    required: false
    default: "true"
  job-start-time:
    description: UTC epoch 毫秒，来自 watchdog/job-start output
    required: true

outputs:
  should-retry:
    description: 看门狗 graceful abort 时为 true
    value: ${{ steps.run-task.outputs.should-retry }}
  aborted:
    description: deadline 触发且曾进入优雅中止流程
    value: ${{ steps.run-task.outputs.aborted }}
  force-killed:
    description: 5× SIGINT 后平台强杀
    value: ${{ steps.run-task.outputs.force-killed }}
  task-succeeded:
    description: 编译子进程 exit code === 0
    value: ${{ steps.run-task.outputs.task-succeeded }}
  exit-code:
    description: 编译子进程退出码
    value: ${{ steps.run-task.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Prepare compile command
      id: prepare
      shell: pwsh
      run: npx tsx scripts/cli.ts 06.prepare --opt-dim ${{ inputs.opt-dim }} --fa-src ${{ inputs.fa-src }}

    - name: Run compile with watchdog
      id: run-task
      uses: hcwhan/actions/kit/watchdog/run@main
      with:
        working-directory: ${{ inputs.fa-src }}
        command: ${{ steps.prepare.outputs.command }}
        args: ${{ steps.prepare.outputs.args }}
        job-start-time: ${{ inputs.job-start-time }}
        limit-hours: "5"

    - name: Post-build ninja cache save
      if: always() && steps.run-task.conclusion != 'skipped' && (inputs.use-cache == 'true' || steps.run-task.conclusion == 'success') && steps.run-task.outputs.force-killed != 'true'
      uses: "./.github/actions/A01.fa-build-with-cache/A01.1.fa-post-build-cache"
      with:
        fa-src: ${{ inputs.fa-src }}
        cache-family-key: ${{ inputs.cache-family-key }}
        cache-key: ${{ inputs.cache-key }}
