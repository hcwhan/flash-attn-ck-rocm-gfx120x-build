name: Restore FA ninja build cache
description: 恢复 flash-attention build/ 增量 cache（NINJA cache-key 槽位最新 versioned key；use-cache=false 时仅 lookup）

inputs:
  fa-src:
    description: flash-attention 源码根目录
    required: true
  cache-family-key:
    description: 05.toolchain-fingerprint 输出的 ninja cache family-key
    required: true
  cache-key:
    description: 05.toolchain-fingerprint 输出的 ninja cache key
    required: true
  use-cache:
    description: true 时在条目存在时从 cache 恢复 build/；false 时仅 lookup（仍报告 cache-exists）
    required: false
    default: "true"

outputs:
  cache-exists:
    description: 远端是否存在 inputs.cache-key 对应条目
    value: ${{ steps.fa-build-cache.outputs.cache-exists }}
  cache-used:
    description: 已将 cache 恢复到 build/（use-cache 且 restore 成功）
    value: ${{ steps.fa-build-cache.outputs.cache-used }}

runs:
  using: composite
  steps:
    - name: Apply cached build directory
      if: inputs.use-cache == 'true'
      uses: hcwhan/actions/kit/cache/restore@main
      id: cache-restore
      with:
        path: ${{ inputs.fa-src }}\build
        family-key: ${{ inputs.cache-family-key }}
        cache-key: ${{ inputs.cache-key }}

    - name: Lookup cache existence (restore skipped)
      if: inputs.use-cache != 'true'
      uses: hcwhan/actions/kit/cache/lookup@main
      id: cache-lookup
      with:
        cache-key: ${{ inputs.cache-key }}

    - name: Resolve cache restore outputs
      id: fa-build-cache
      shell: pwsh
      run: |
        if ('${{ inputs.use-cache }}' -eq 'true') {
          $exists = '${{ steps.cache-restore.outputs.cache-exists }}' -eq 'true'
          $used = '${{ steps.cache-restore.outputs.cache-used }}' -eq 'true'
          Write-Host "Cache restore: exists=$exists used=$used key=${{ inputs.cache-key }}"
        } else {
          $exists = '${{ steps.cache-lookup.outputs.cache-exists }}' -eq 'true'
          $used = $false
          Write-Host "Cache restore skipped; lookup exists=$exists used=false key=${{ inputs.cache-key }}"
        }
        $existsStr = if ($exists) { 'true' } else { 'false' }
        $usedStr = if ($used) { 'true' } else { 'false' }
        "cache-exists=$existsStr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "cache-used=$usedStr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
