name: Restore FA ninja build cache
description: 恢复 flash-attention build/ 增量 cache（仅精确 cache-key 匹配；无 restore-keys 回退）

inputs:
  fa-src:
    description: flash-attention 源码根目录
    required: true
  cache-key:
    description: 05.toolchain-fingerprint 输出的主 cache key
    required: true
  use-cache:
    description: true 时在条目存在时从 cache 恢复 build/；false 时仅 lookup（仍报告 cache-exists）
    required: false
    default: "true"

outputs:
  cache-exists:
    description: 远端是否存在 inputs.cache-key 对应条目（lookup/restore 的 cache-hit）
    value: ${{ steps.fa-build-cache.outputs.cache-exists }}
  cache-used:
    description: 已将 cache 恢复到 build/（use-cache 且 cache-exists）
    value: ${{ steps.fa-build-cache.outputs.cache-used }}
  cache-primary-key:
    description: 写入/lookup 用的 cache key（use-cache=false 时等于 inputs.cache-key）
    value: ${{ steps.fa-build-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Apply cached build directory
      if: inputs.use-cache == 'true'
      uses: actions/cache/restore@v6
      id: cache-restore
      with:
        path: ${{ inputs.fa-src }}\build
        key: ${{ inputs.cache-key }}

    - name: Lookup cache existence (restore skipped)
      if: inputs.use-cache != 'true'
      uses: actions/cache/restore@v6
      id: cache-lookup
      with:
        path: ${{ inputs.fa-src }}\build
        key: ${{ inputs.cache-key }}
        lookup-only: true

    - name: Resolve cache restore outputs
      id: fa-build-cache
      shell: pwsh
      run: |
        if ('${{ inputs.use-cache }}' -eq 'true') {
          $exists = '${{ steps.cache-restore.outputs.cache-hit }}' -eq 'true'
          Write-Host "Cache restore: exists=$exists used=$exists"
          "cache-primary-key=${{ steps.cache-restore.outputs.cache-primary-key }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cache-exists=$exists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cache-used=$exists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        } else {
          $exists = '${{ steps.cache-lookup.outputs.cache-hit }}' -eq 'true'
          Write-Host "Cache restore skipped; lookup exists=$exists used=false"
          "cache-primary-key=${{ inputs.cache-key }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cache-exists=$exists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cache-used=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        }
