name: FA job bootstrap
description: Checkout, Node/npm, 01.config, optional prep/patch, and toolchain

inputs:
  prep-source:
    description: Run 03.prep and 04.patch (requires FA_SRC job env)
    required: false
    default: "true"
  setup-toolchain:
    description: Run A01.fa-rocm-toolchain (reads PYTHON_* / ROCM_* / PIP_TOOLCHAIN_CACHE_KEY from 01.config)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Checkout build repo
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "26"
        cache: npm

    - name: Install npm dependencies
      shell: pwsh
      run: npm ci

    - name: Load VERSION.lock.json
      shell: pwsh
      run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

    - name: Clone and patch flash-attention source
      if: inputs.prep-source == 'true'
      shell: pwsh
      run: |
        npx tsx scripts/cli.ts 03.prep --fa-src $env:FA_SRC
        npx tsx scripts/cli.ts 04.patch --fa-src $env:FA_SRC

    - name: Setup ROCm toolchain
      if: inputs.setup-toolchain == 'true'
      uses: "./.github/actions/A01.fa-rocm-toolchain"
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        pytorch-version: ${{ env.PYTORCH_VERSION }}
        torch-device-extra: ${{ env.TORCH_DEVICE_EXTRA }}
        rocm-index: ${{ env.ROCM_INDEX }}
        rocm-version: ${{ env.ROCM_VERSION }}
        pip-cache-key: ${{ env.PIP_TOOLCHAIN_CACHE_KEY }}
