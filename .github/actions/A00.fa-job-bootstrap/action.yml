name: FA job bootstrap
description: Node/npm、01.config、A00.1 toolchain、可选 05.toolchain-fingerprint + A00.2 ninja restore、条件 03.prep/04.patch（需 job 级 checkout 与 env FA_SRC/USE_CACHE）

inputs:
  prep-source:
    description: 运行 03.prep 与 04.patch（需 FA_SRC；且同 job 内已 01.config --export-github-env）
    required: false
    default: "true"
  setup-toolchain:
    description: 运行 A00.1.fa-rocm-toolchain（PYTHON/PYTORCH/TORCH_DEVICE_EXTRA/ROCM_INDEX/ROCM_VERSION/PIP_TOOLCHAIN_CACHE_KEY）
    required: false
    default: "true"
  ninja-cache-restore:
    description: true 时运行 05.toolchain-fingerprint + A00.2 restore（compile job）
    required: false
    default: "false"
  build-variant:
    description: serial 或 parallel（ninja-cache-restore 时必填）
    required: false
  opt-dim:
    description: parallel shard OPT_DIM（build-variant=parallel 时必填）
    required: false

outputs:
  cache-key:
    description: 05.toolchain-fingerprint 输出的 ninja cache key
    value: ${{ steps.ninja-fingerprint.outputs.cache-key }}
  cache-exists:
    description: ninja cache 远程条目是否存在
    value: ${{ steps.ninja-cache.outputs.cache-exists }}
  cache-used:
    description: 已 restore ninja cache 到 build/
    value: ${{ steps.ninja-cache.outputs.cache-used }}
  cache-primary-key:
    description: ninja cache save/lookup 用的 key
    value: ${{ steps.ninja-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Record job start time
      shell: pwsh
      run: |
        $epochMs = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
        "JOB_START_TIME=$epochMs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "JOB_START_TIME=$epochMs"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "26"
        cache: npm

    - name: Install npm dependencies
      shell: pwsh
      run: npm ci

    - name: Load build version lock into environment
      shell: pwsh
      run: npx tsx scripts/cli.ts 01.config -w $env:GITHUB_WORKSPACE --export-github-env

    - name: Clone and patch flash-attention source
      if: inputs.prep-source == 'true'
      shell: pwsh
      run: |
        npx tsx scripts/cli.ts 03.prep --fa-src $env:FA_SRC
        npx tsx scripts/cli.ts 04.patch --fa-src $env:FA_SRC

    - name: Setup ROCm toolchain
      if: inputs.setup-toolchain == 'true'
      uses: "./.github/actions/A00.fa-job-bootstrap/A00.1.fa-rocm-toolchain"
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        pytorch-version: ${{ env.PYTORCH_VERSION }}
        torch-device-extra: ${{ env.TORCH_DEVICE_EXTRA }}
        rocm-index: ${{ env.ROCM_INDEX }}
        rocm-version: ${{ env.ROCM_VERSION }}
        pip-cache-key: ${{ env.PIP_TOOLCHAIN_CACHE_KEY }}

    - name: Fingerprint toolchain for ninja cache key
      if: inputs.ninja-cache-restore == 'true'
      id: ninja-fingerprint
      shell: pwsh
      run: |
        if ('${{ inputs.build-variant }}' -eq 'parallel') {
          npx tsx scripts/cli.ts 05.toolchain-fingerprint -w $env:GITHUB_WORKSPACE --build-variant parallel --opt-dim "${{ inputs.opt-dim }}"
        } else {
          npx tsx scripts/cli.ts 05.toolchain-fingerprint -w $env:GITHUB_WORKSPACE --build-variant serial
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Restore ninja incremental build cache
      if: inputs.ninja-cache-restore == 'true'
      id: ninja-cache
      uses: "./.github/actions/A00.fa-job-bootstrap/A00.2.fa-ninja-cache-restore"
      with:
        fa-src: ${{ env.FA_SRC }}
        cache-key: ${{ steps.ninja-fingerprint.outputs.cache-key }}
        use-cache: ${{ env.USE_CACHE }}
