name: FA smoke test and upload wheel
description: Run CPU smoke test on dist/*.whl; run GPU smoke when gfx1201 is available; upload wheel artifact

runs:
  using: composite
  steps:
    - name: Smoke test (CPU + GPU when gfx1201 available)
      shell: pwsh
      run: |
        . "$env:GITHUB_WORKSPACE\build\8.verify - wheel-smoke-test.ps1" `
          -DistDir $env:GITHUB_WORKSPACE\dist `
          -WorkspaceRoot $env:GITHUB_WORKSPACE

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.WHEEL_ARTIFACT_NAME }}
        path: |
          dist/*.whl
          dist/*.sha256
          dist/wheel.manifest.json
        retention-days: 30
